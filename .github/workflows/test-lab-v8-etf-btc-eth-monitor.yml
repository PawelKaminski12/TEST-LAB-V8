name: TEST LAB V8 ETF BTC ETH Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'
  push:
    paths:
      - 'scripts/v8_etf_btc_eth_monitor.py'
      - '.github/workflows/test-lab-v8-etf-btc-eth-monitor.yml'

permissions:
  contents: write

concurrency:
  group: v8-etf-btc-eth-monitor
  cancel-in-progress: false

jobs:
  build-etf-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz najnowszy projekt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Przygotuj Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zainstaluj biblioteki
        run: pip install --quiet pandas requests

      - name: Pobierz i policz przepływy ETF BTC oraz ETH
        run: python scripts/v8_etf_btc_eth_monitor.py

      - name: Sprawdź jakość i zasady bezpieczeństwa
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          p=Path('institutional_data_hub/ETF_BTC_ETH_STATUS.json')
          c=Path('institutional_data_hub/ETF_BTC_ETH_PANEL.csv')
          m=Path('institutional_data_hub/ETF_BTC_ETH_LATEST.md')
          assert p.exists() and c.exists() and m.exists()
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['engine']=='V8_ETF_BTC_ETH_MONITOR_v1.0'
          assert x['safety']['same_day_etf_values_are_provisional'] is True
          assert x['safety']['closed_day_values_drive_scores'] is True
          assert x['safety']['execution_connected'] is False
          assert set(x['assets'])=={'BTC','ETH'}
          for a in ['BTC','ETH']:
              z=x['assets'][a]
              assert z['last_closed_date']
              assert z['today_status_pl']
              assert z['rules']['today_never_treated_as_final_same_day'] is True
              assert z['rules']['zero_today_does_not_mean_final_zero'] is True
              assert z['closed_trend']['label_pl']
          df=pd.read_csv(c)
          assert list(df['AKTYWO'])==['BTC','ETH']
          txt=m.read_text(encoding='utf-8')
          assert 'Dzisiejszy odczyt nie jest traktowany jako wynik końcowy' in txt
          assert 'WSPÓLNY OBRAZ' in txt
          print('Monitor ETF BTC/ETH: dane i zabezpieczenia sprawdzone poprawnie')
          PY

      - name: Zapisz wyniki bez utraty zmian z innych procesów
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/etfmon
          cp institutional_data_hub/ETF_BTC_ETH_STATUS.json institutional_data_hub/ETF_BTC_ETH_PANEL.csv institutional_data_hub/ETF_BTC_ETH_LATEST.md /tmp/etfmon/
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p institutional_data_hub
            cp /tmp/etfmon/ETF_BTC_ETH_STATUS.json /tmp/etfmon/ETF_BTC_ETH_PANEL.csv /tmp/etfmon/ETF_BTC_ETH_LATEST.md institutional_data_hub/
            git add institutional_data_hub/ETF_BTC_ETH_STATUS.json institutional_data_hub/ETF_BTC_ETH_PANEL.csv institutional_data_hub/ETF_BTC_ETH_LATEST.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Update V8 BTC ETH ETF monitor'
            if git push origin main; then exit 0; fi
            echo "Konflikt zapisu — ponawiam próbę $attempt"
            sleep $((attempt * 3))
          done
          exit 1
