name: TEST LAB V8 Sheets ETF Monitor Integration

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/v8_patch_sheets_etf.py'
      - '.github/workflows/test-lab-v8-sheets-etf-monitor-integration.yml'

permissions:
  contents: write

concurrency:
  group: v8-sheets-etf-monitor-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz najnowszy projekt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wepnij monitor ETF do pełnego skryptu panelu
        run: python scripts/v8_patch_sheets_etf.py

      - name: Sprawdź pełny skrypt i zabezpieczenia
        run: |
          cp google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL.txt /tmp/v8_sheets_check.js
          node --check /tmp/v8_sheets_check.js
          python - <<'PY'
          from pathlib import Path
          s=Path('google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL.txt').read_text(encoding='utf-8')
          required=[
              "institutional_data_hub/ETF_BTC_ETH_STATUS.json",
              "institutional_data_hub/ETF_BTC_ETH_HISTORY.csv",
              "etfHistory: 'ETF_HISTORIA'",
              'function writeEtfHistory_',
              'Dzisiejsze dane są wstępne. Trend liczymy wyłącznie z zakończonych dni ETF.',
              "AUTO_EXECUTION','OFF"
          ]
          for item in required:
              assert item in s, item
          assert 'No broker execution' in s or 'no broker execution' in s.lower()
          print('Panel ETF: składnia, historia i zabezpieczenia poprawne')
          PY

      - name: Zapisz pełny skrypt panelu
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL.txt /tmp/DUAL_ENGINE_APPS_SCRIPT_FULL.txt
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/DUAL_ENGINE_APPS_SCRIPT_FULL.txt google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL.txt
            git add google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL.txt
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Integrate verified BTC ETH ETF monitor into Sheets panel'
            if git push origin main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
