name: TEST LAB V8 Calibration Data Refresh

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-lab-v8-calibration-data.yml"

jobs:
  refresh-calibration-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build fresh ETH 1D without Binance API
        run: |
          python - <<'PY'
          import csv, io, json, urllib.request, zipfile
          from datetime import date, datetime, timedelta, timezone

          CUTOVER = date(2025, 6, 5)

          def fetch_text(url):
              req = urllib.request.Request(url, headers={"User-Agent":"TEST-LAB-V8/6E2"})
              with urllib.request.urlopen(req, timeout=45) as r:
                  return r.read().decode("utf-8-sig")

          def parse_a(text):
              rows={}
              rd=csv.DictReader(io.StringIO(text))
              for r in rd:
                  if not r or not r.get("timestamp"): continue
                  s=r["timestamp"].strip()
                  if s.startswith(("<<<<<<<","=======",">>>>>>>")): continue
                  try:
                      d=datetime.fromisoformat(s.replace("Z","+00:00")).date()
                      rows[d]=[d.isoformat(),r["open"],r["high"],r["low"],r["close"],r["volume"]]
                  except Exception:
                      continue
              return rows

          def parse_b(text):
              rows={}
              rd=csv.DictReader(io.StringIO(text))
              for r in rd:
                  if not r or not r.get("date"): continue
                  d=date.fromisoformat(r["date"][:10])
                  rows[d]=[d.isoformat(),r["open"],r["high"],r["low"],r["close"],r["volume"]]
              return rows

          def ts_to_date(raw):
              x=int(raw)
              # Binance Vision uses microseconds in newer archives, milliseconds in older ones.
              seconds = x / 1_000_000 if x > 10_000_000_000_000 else x / 1_000
              return datetime.fromtimestamp(seconds, tz=timezone.utc).date()

          a_url="https://raw.githubusercontent.com/MakarZakharov/CryptoTrade/main/data/binance/ETHUSDT/1d/2018_01_01-now.csv"
          b_url="https://raw.githubusercontent.com/congde/web3-quant-sandbox/a6cc399d715f540110ed1aea4eb3bbe536a2f29b/data/investment_gate/ETHUSDT.csv"
          A=parse_a(fetch_text(a_url))
          B=parse_b(fetch_text(b_url))

          merged={}
          for d,row in A.items():
              if d < CUTOVER:
                  merged[d]=row
          for d,row in B.items():
              if d >= CUTOVER:
                  merged[d]=row

          last=max(merged)
          today=datetime.now(timezone.utc).date()
          target=today-timedelta(days=1)
          d=last+timedelta(days=1)
          added=0
          skipped=[]
          while d <= target:
              url=f"https://data.binance.vision/data/spot/daily/klines/ETHUSDT/1d/ETHUSDT-1d-{d.isoformat()}.zip"
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"TEST-LAB-V8/6E2"})
                  with urllib.request.urlopen(req,timeout=45) as r:
                      blob=r.read()
                  with zipfile.ZipFile(io.BytesIO(blob)) as z:
                      name=z.namelist()[0]
                      text=z.read(name).decode("utf-8")
                  rr=next(csv.reader(io.StringIO(text)))
                  dd=ts_to_date(rr[0])
                  if dd != d:
                      raise ValueError(f"archive date mismatch expected={d} got={dd}")
                  merged[dd]=[dd.isoformat(),rr[1],rr[2],rr[3],rr[4],rr[5]]
                  added+=1
              except Exception as e:
                  skipped.append([d.isoformat(),repr(e)])
                  print("SKIP",d.isoformat(),repr(e))
              d += timedelta(days=1)

          rows=[merged[k] for k in sorted(merged)]
          with open("ETH_CALIBRATION_1D.csv","w",newline="",encoding="utf-8") as f:
              w=csv.writer(f); w.writerow(["Date","Open","High","Low","Close","Volume"]); w.writerows(rows)

          report={
              "rows":len(rows),
              "start":rows[0][0] if rows else None,
              "end":rows[-1][0] if rows else None,
              "binance_vision_daily_added":added,
              "skipped_count":len(skipped),
              "skipped":skipped,
              "source_a_until":"2025-06-04",
              "source_b_from":"2025-06-05",
              "refresh_target":target.isoformat(),
              "target_reached": bool(rows and rows[-1][0] == target.isoformat())
          }
          open("ETH_CALIBRATION_META.json","w",encoding="utf-8").write(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          if not report["target_reached"]:
              raise SystemExit("ETH calibration refresh did not reach target date")
          PY

      - name: Copy fresh BTC and NVDA source files
        run: |
          curl -L --fail "https://raw.githubusercontent.com/jptrustlearning/btc/main/btc_prices.csv" -o BTC_CALIBRATION_1D_RAW.csv
          curl -L --fail "https://raw.githubusercontent.com/yennanliu/finance_data/main/data/prices/nvda.csv" -o NVDA_CALIBRATION_1D_RAW.csv

      - name: Upload calibration data
        uses: actions/upload-artifact@v4
        with:
          name: TEST-LAB-V8-CALIBRATION-DATA
          path: |
            ETH_CALIBRATION_1D.csv
            ETH_CALIBRATION_META.json
            BTC_CALIBRATION_1D_RAW.csv
            NVDA_CALIBRATION_1D_RAW.csv
          if-no-files-found: error
          retention-days: 7
