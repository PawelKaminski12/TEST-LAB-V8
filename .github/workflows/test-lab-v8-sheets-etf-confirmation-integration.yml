name: TEST LAB V8 Sheets ETF Confirmation Integration

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/v8_sheets_etf_confirmation_patch.py'
      - '.github/workflows/test-lab-v8-sheets-etf-confirmation-integration.yml'

permissions:
  contents: write

concurrency:
  group: v8-sheets-etf-confirmation-integration
  cancel-in-progress: false

jobs:
  integrate-confirmation:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz najnowszy projekt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Dodaj potwierdzenie ceny z ETF do pełnego panelu
        run: python scripts/v8_sheets_etf_confirmation_patch.py

      - name: Sprawdź składnię pełnego skryptu
        run: |
          cp google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL.txt /tmp/v8_sheets_confirmation.js
          node --check /tmp/v8_sheets_confirmation.js

      - name: Sprawdź dane i zabezpieczenia
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          s=Path('google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL.txt').read_text(encoding='utf-8')
          c=json.loads(Path('institutional_data_hub/ETF_BTC_ETH_CONFIRMATION.json').read_text(encoding='utf-8'))
          required=[
            "institutional_data_hub/ETF_BTC_ETH_CONFIRMATION.json",
            'CENA vs ETF 5D',
            'CENA vs ETF 20D',
            'JAKOŚĆ DANYCH',
            'Filtr ceny vs ETF używa tylko zakończonych dni',
            'nie nadpisuje twardych blokad LONG ani TACTICAL',
            "AUTO_EXECUTION','OFF",
            'No broker execution'
          ]
          for x in required:
              assert x in s, x
          assert c['rules']['today_preview_never_used_as_final'] is True
          assert c['rules']['price_etf_divergence_reduces_confirmation'] is True
          assert c['rules']['etf_never_overrides_hard_blockers'] is True
          assert c['rules']['execution_connected'] is False
          print('Panel cena vs ETF: dane, składnia i zabezpieczenia poprawne')
          PY

      - name: Zapisz pełny skrypt panelu bez konfliktu
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL.txt /tmp/DUAL_ENGINE_APPS_SCRIPT_FULL.txt
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/DUAL_ENGINE_APPS_SCRIPT_FULL.txt google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL.txt
            git add google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL.txt
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Integrate ETF price confirmation into Sheets panel'
            if git push origin main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
