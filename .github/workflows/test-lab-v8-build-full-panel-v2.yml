name: TEST LAB V8 Build Full Panel V2

on:
  push:
    paths:
      - 'google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL.txt'
      - 'google_sheets/V8_EXTREME_CONFLUENCE_V2.txt'
      - '.github/workflows/test-lab-v8-build-full-panel-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v8-build-full-panel-v2
  cancel-in-progress: false

jobs:
  build-test-save:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Zbuduj pełny skrypt V2
        run: |
          cat google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL.txt > /tmp/DUAL_ENGINE_APPS_SCRIPT_FULL_V2.txt
          printf '\n\n// ===== V8 EXTREME CONFLUENCE V2 — TESTED OVERRIDES =====\n\n' >> /tmp/DUAL_ENGINE_APPS_SCRIPT_FULL_V2.txt
          cat google_sheets/V8_EXTREME_CONFLUENCE_V2.txt >> /tmp/DUAL_ENGINE_APPS_SCRIPT_FULL_V2.txt

      - name: Sprawdź składnię pełnego skryptu
        run: |
          cp /tmp/DUAL_ENGINE_APPS_SCRIPT_FULL_V2.txt /tmp/DUAL_ENGINE_APPS_SCRIPT_FULL_V2.js
          node --check /tmp/DUAL_ENGINE_APPS_SCRIPT_FULL_V2.js

      - name: Sprawdź integralność pełnego panelu
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('/tmp/DUAL_ENGINE_APPS_SCRIPT_FULL_V2.txt').read_text(encoding='utf-8')
          required = [
              'function ODSWIEZ_WSZYSTKO()',
              'function ODSWIEZ_ETF_BTC_ETH()',
              'function ODSWIEZ_LAB()',
              'function SPRAWDZ_EKSTREMA()',
              'function writeLongEngine_',
              'function writeTacticalEngine_',
              'function writePolishPanel_',
              'function buildExtremeAlarms_',
              'function confluencePriority_',
              'function writeExtremeAlarms_',
              "['1H','4H','1D']",
              "return 'KRYTYCZNY'",
              "return 'MOCNY'",
              "return 'OSTRZEŻENIE'",
          ]
          missing = [x for x in required if x not in s]
          forbidden = ['placeOrder(', 'createOrder(', 'broker.']
          found_forbidden = [x for x in forbidden if x in s]
          if missing:
              raise SystemExit('BRAK W PEŁNYM SKRYPCIE: ' + ', '.join(missing))
          if found_forbidden:
              raise SystemExit('NIEDOZWOLONA LOGIKA WYKONAWCZA: ' + ', '.join(found_forbidden))
          print('PASS — pełny panel V2 zachowuje LONG, TACTICAL i dodaje zbieżności ekstremów')
          PY

      - name: Zapisz pełny skrypt V2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp /tmp/DUAL_ENGINE_APPS_SCRIPT_FULL_V2.txt google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V2.txt
          git add google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V2.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build full V8 panel V2 with extreme confluence'
          git push origin main
