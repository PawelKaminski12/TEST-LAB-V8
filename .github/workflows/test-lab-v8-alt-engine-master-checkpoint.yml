name: TEST LAB V8 Alt Engine Master Checkpoint

on:
  workflow_dispatch:
  schedule:
    - cron: '55 6 * * *'
  push:
    paths:
      - '.github/workflows/test-lab-v8-alt-engine-master-checkpoint.yml'
      - 'config/alt_universe.csv'
      - 'config/alt_zones.csv'
      - 'crypto_data_hub/LATEST_SNAPSHOT.json'
      - 'crypto_data_hub/ALT_ROTATION_SCORE.json'
      - 'crypto_data_hub/ALT_TECHNICAL_LAYER.json'
      - 'crypto_data_hub/ALT_DECISION_ENGINE.json'
      - 'crypto_data_hub/ALT_ENGINE_READINESS.json'
      - 'crypto_data_hub/CRYPTO_MARKET_PHASE.json'
      - 'crypto_data_hub/ONCHAIN_ACTIVITY.json'

permissions:
  contents: write

concurrency:
  group: v8-alt-master-checkpoint-writes
  cancel-in-progress: false

jobs:
  build-master-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: pip install --quiet pandas

      - name: Build master checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          R=Path('crypto_data_hub')
          paths={
              'snapshot':R/'LATEST_SNAPSHOT.json','rotation':R/'ALT_ROTATION_SCORE.json',
              'technical':R/'ALT_TECHNICAL_LAYER.json','decision':R/'ALT_DECISION_ENGINE.json',
              'readiness':R/'ALT_ENGINE_READINESS.json','phase':R/'CRYPTO_MARKET_PHASE.json',
              'onchain':R/'ONCHAIN_ACTIVITY.json','universe':Path('config/alt_universe.csv'),
              'zones':Path('config/alt_zones.csv')
          }
          missing=[k for k,p in paths.items() if not p.exists()]
          if missing: raise SystemExit('Missing core modules: '+', '.join(missing))

          snap=json.loads(paths['snapshot'].read_text(encoding='utf-8'))
          rot=json.loads(paths['rotation'].read_text(encoding='utf-8'))
          tech=json.loads(paths['technical'].read_text(encoding='utf-8'))
          dec=json.loads(paths['decision'].read_text(encoding='utf-8'))
          ready=json.loads(paths['readiness'].read_text(encoding='utf-8'))
          phase=json.loads(paths['phase'].read_text(encoding='utf-8'))
          onchain=json.loads(paths['onchain'].read_text(encoding='utf-8'))
          cfg=pd.read_csv(paths['universe'])
          cfg=cfg[(cfg['enabled'].astype(str).str.lower()=='true') & (cfg['target_scope'].astype(str).str.upper()=='PRODUCTION')].copy()
          zones=pd.read_csv(paths['zones'])

          symbols=[str(x).upper().strip() for x in cfg['symbol'].tolist()]
          techmap={x.get('symbol'):x for x in tech.get('assets',[])}
          decmap={x.get('symbol'):x for x in dec.get('assets',[])}
          readymap={x.get('symbol'):x for x in ready.get('assets',[])}
          phasemap={x.get('symbol'):x for x in phase.get('asset_context',[])}
          onmap={x.get('symbol'):x for x in onchain.get('assets',[])}
          dual_flow=phase.get('dual_horizon_flow_context',{}) or {}
          long_flow=dual_flow.get('LONG',{}) or {}
          tactical_flow=dual_flow.get('TACTICAL',{}) or {}

          def trusted_onchain(x):
              return str(x.get('quality_gate','')).upper()=='TRUSTED' and int(x.get('coverage_pct',0) or 0)>=40 and int(x.get('directional_votes',0) or 0)>=2

          rows=[]
          trusted_count=0
          project_specific_count=0
          network_liquidity_count=0
          for sym in symbols:
              t=techmap.get(sym,{}); d=decmap.get(sym,{}); rr=readymap.get(sym,{}); pc=phasemap.get(sym,{})
              oc=onmap.get(sym,{})
              trusted=trusted_onchain(oc)
              if trusted: trusted_count+=1
              profile=oc.get('metric_profile')
              protocol=(oc.get('protocol_tvl') or {}) if isinstance(oc.get('protocol_tvl'),dict) else {}
              pfees=(oc.get('protocol_fees') or {}) if isinstance(oc.get('protocol_fees'),dict) else {}
              chain=(oc.get('chain_tvl') or {}) if isinstance(oc.get('chain_tvl'),dict) else {}
              dex=(oc.get('dex_volume') or {}) if isinstance(oc.get('dex_volume'),dict) else {}
              stable=(oc.get('stablecoin_liquidity') or {}) if isinstance(oc.get('stablecoin_liquidity'),dict) else {}
              fees=(oc.get('chain_fees') or {}) if isinstance(oc.get('chain_fees'),dict) else {}
              project_ok=trusted and profile=='RWA_PROTOCOL' and protocol.get('latest_usd') is not None
              network_liquidity_ok=trusted and profile=='CHAIN_L1' and stable.get('latest_usd') is not None
              if project_ok: project_specific_count+=1
              if network_liquidity_ok: network_liquidity_count+=1
              z=zones[zones['symbol'].astype(str).str.upper().eq(sym)]
              tfs=sorted(set(z['timeframe'].astype(str).str.upper())) if not z.empty else []
              rows.append({
                  'symbol':sym,'data_quality':rr.get('data_quality_score_0_100'),'readiness_status':rr.get('readiness_status'),
                  'full_zones_ready':rr.get('zones_full_ready'),'zone_timeframes':','.join(tfs),
                  'trend_score_0_4':t.get('trend_score_0_4'),'fomo_score_0_10':t.get('fomo_score_0_10'),
                  'rotation_label':pc.get('rotation_label'),'market_phase':phase.get('phase'),
                  'long_flow_score_0_10':d.get('long_flow_score_0_10',pc.get('long_flow_score_0_10')),'long_flow_label':d.get('long_flow_label'),
                  'tactical_flow_score_0_5':pc.get('tactical_flow_score_0_5'),
                  'direct_etf_5d_usdm':(pc.get('direct_etf_context') or {}).get('flow_5d_usdm') if isinstance(pc.get('direct_etf_context'),dict) else None,
                  'direct_etf_20d_usdm':(pc.get('direct_etf_context') or {}).get('flow_20d_usdm') if isinstance(pc.get('direct_etf_context'),dict) else None,
                  'direct_etf_30d_usdm':(pc.get('direct_etf_context') or {}).get('flow_30d_usdm') if isinstance(pc.get('direct_etf_context'),dict) else None,
                  'onchain_profile':profile,'onchain_coverage_pct':oc.get('coverage_pct'),'onchain_directional_votes':oc.get('directional_votes'),
                  'onchain_quality_gate':oc.get('quality_gate'),'onchain_trusted':trusted,
                  'long_onchain_score_0_10':oc.get('long_onchain_score_0_10') if trusted else None,
                  'long_onchain_label':oc.get('long_onchain_label') if trusted else 'INSUFFICIENT_QUALITY',
                  'tactical_onchain_score_0_10':oc.get('tactical_onchain_score_0_10') if trusted else None,
                  'tactical_onchain_label':oc.get('tactical_onchain_label') if trusted else 'INSUFFICIENT_QUALITY',
                  'chain_tvl_usd':chain.get('latest_usd'),'chain_tvl_30d_pct':chain.get('change_30d_pct'),
                  'dex_daily_usd':dex.get('latest_daily_usd'),'dex_30d_vs_prev30_pct':dex.get('change_30d_vs_prev30_pct'),
                  'stablecoin_mcap_usd':stable.get('latest_usd'),'stablecoin_30d_pct':stable.get('change_30d_pct'),
                  'chain_fees_daily_usd':fees.get('latest_daily_usd'),'chain_fees_30d_vs_prev30_pct':fees.get('change_30d_vs_prev30_pct'),
                  'protocol_tvl_usd':protocol.get('latest_usd') if trusted else None,'protocol_tvl_30d_pct':protocol.get('change_30d_pct') if trusted else None,
                  'protocol_fees_30d_usd':pfees.get('fees_30d_usd') if trusted else None,
                  'protocol_fees_30d_vs_prev30_pct':pfees.get('change_30d_vs_prev30_pct') if trusted else None,
                  'decision':d.get('decision'),'dca1':d.get('zones',{}).get('dca1'),'dca2':d.get('zones',{}).get('dca2'),'dca3':d.get('zones',{}).get('dca3'),
                  'blockers':'|'.join(d.get('blockers',[])),
              })

          df=pd.DataFrame(rows)
          prod_ready=len(df)>0 and bool(df['readiness_status'].eq('PRODUCTION_DATA_READY').all())
          full_zones=len(df)>0 and bool(df['full_zones_ready'].fillna(False).all())
          decisions_present=len(df)>0 and bool(df['decision'].notna().all()) and bool((df['decision']!='DATA_PENDING').all())
          technical_ready=all(sym in techmap and techmap[sym].get('qa')=='PASS' for sym in symbols)
          rotation_ready=rot.get('score_0_10') is not None
          phase_ready=phase.get('phase') is not None
          q=snap.get('qa',{}) or {}
          snapshot_qa=bool(q.get('PASS'))
          long_flow_ready=long_flow.get('score_0_10') is not None and long_flow.get('label') is not None
          tactical_flow_ready=tactical_flow.get('score_0_5') is not None and tactical_flow.get('label') is not None
          etf_ready=int(q.get('btc_etf_rows',0) or 0)>100 and int(q.get('eth_etf_rows',0) or 0)>100
          stablecoin_ready=int(q.get('stablecoin_history_rows',0) or 0)>100
          ethbtc_ready=int(q.get('eth_btc_history_rows',0) or 0)>200

          core_modules={
              'PRICE_DATA_QA':snapshot_qa,'FULL_ZONES_1D_TO_2T':full_zones,'TECHNICAL_LAYER':technical_ready,
              'ROTATION_LAYER':rotation_ready,'MARKET_PHASE_LAYER':phase_ready,'DUAL_HORIZON_FLOW_CONTEXT':long_flow_ready and tactical_flow_ready,
              'ETF_BTC_ETH_FEED':etf_ready,'STABLECOIN_LIQUIDITY_FEED':stablecoin_ready,'ETH_BTC_RELATIVE_STRENGTH':ethbtc_ready,
              'DECISION_LAYER':decisions_present,
          }
          core_ready=sum(bool(v) for v in core_modules.values())
          source_health=(onchain.get('summary',{}) or {}).get('source_health',{}) or {}
          network_activity_feed=int(source_health.get('coinmetrics_assets_ok',0) or 0)>0
          chain_liquidity_layer=network_liquidity_count>=1
          project_context=project_specific_count>=1
          extended={
              'BROAD_ROTATION_20D_HISTORY':bool(rot.get('broad_rotation_history_ready')),
              'SOL_ETF_MATURE_20_ROWS':int(q.get('sol_etf_rows',0) or 0)>=20,
              'ONCHAIN_CHAIN_LIQUIDITY_ACTIVITY_LAYER':chain_liquidity_layer,
              'ONCHAIN_PROJECT_SPECIFIC_CONTEXT':project_context,
              'ONCHAIN_NETWORK_ADDRESS_ACTIVITY_FEED':network_activity_feed,
              'EXCHANGE_WHALE_FLOW_FEED':False,
              'ETF_INDEPENDENT_SOURCE_CROSSCHECK':False,
              'PORTFOLIO_EXECUTION_CONNECTION':False,
          }
          ext_ready=sum(bool(v) for v in extended.values())
          status='CORE_ALT_ENGINE_READY_FOR_VALIDATION' if core_ready==len(core_modules) else 'CORE_ALT_ENGINE_INCOMPLETE'

          blockers=[]
          if not prod_ready: blockers.append('PRODUCTION_DATA_NOT_4_OF_4')
          if not full_zones: blockers.append('FULL_ZONE_MAP_NOT_4_OF_4')
          if not decisions_present: blockers.append('DECISION_LAYER_PENDING')
          if not long_flow_ready or not tactical_flow_ready: blockers.append('DUAL_FLOW_CONTEXT_PENDING')
          if not etf_ready: blockers.append('BTC_ETH_ETF_FEED_NOT_READY')
          if not stablecoin_ready: blockers.append('STABLECOIN_FEED_NOT_READY')
          if not ethbtc_ready: blockers.append('ETH_BTC_HISTORY_NOT_READY')
          if not rot.get('broad_rotation_history_ready'): blockers.append('BROAD_ROTATION_HISTORY_MATURING')
          if int(q.get('sol_etf_rows',0) or 0)<20: blockers.append('SOL_ETF_HISTORY_IMMATURE')
          if not network_activity_feed: blockers.append('ONCHAIN_ADDRESS_ACTIVITY_SOURCE_PENDING')
          if not project_context: blockers.append('PROJECT_SPECIFIC_ONCHAIN_CONTEXT_NOT_TRUSTED')
          blockers += ['EXCHANGE_WHALE_FLOW_SOURCE_PENDING','ETF_SOURCE_CROSSCHECK_PENDING','NOT_CONNECTED_TO_PORTFOLIO_EXECUTION']

          out={
              'date':snap.get('target_date'),'engine':'ALT_ENGINE_MASTER_CHECKPOINT_v0.5','status':status,
              'production_universe':symbols,'production_assets_count':len(symbols),'production_assets_ready':int(df['readiness_status'].eq('PRODUCTION_DATA_READY').sum()),
              'core_modules_ready':f'{core_ready}/{len(core_modules)}','core_modules':core_modules,
              'extended_modules_ready':f'{ext_ready}/{len(extended)}','extended_modules':extended,
              'crypto_market_phase':phase.get('phase'),'market_phase_confidence':phase.get('phase_confidence'),
              'alt_rotation_score_0_10':rot.get('score_0_10'),'alt_rotation_status':rot.get('status'),
              'long_flow_context':long_flow,'tactical_flow_context':tactical_flow,
              'onchain_context':{
                  'engine':onchain.get('engine'),'generated_at_utc':onchain.get('generated_at_utc'),
                  'assets_with_any_data':(onchain.get('summary',{}) or {}).get('assets_with_any_data'),
                  'trusted_assets':trusted_count,'project_specific_trusted_assets':project_specific_count,
                  'chain_liquidity_trusted_assets':network_liquidity_count,
                  'source_health':source_health,'role':'context only; never standalone buy/sell signal'
              },
              'research_only':True,'not_strategy_frozen':True,'not_execution_connected':True,
              'blockers_or_maturity_gaps':blockers,'assets':rows,
              'rules':{
                  'V7_UNTOUCHED':True,'NO_ZONE_GUESSING':True,'PRODUCTION_AND_TEST_UNIVERSES_SEPARATE':True,
                  'DATA_PENDING_NOT_TRADE_SIGNAL':True,'MARKET_PHASE_CONTEXT_NOT_HARD_BUY_GATE':True,'ETF_FLOW_CONFIRMATION_NOT_ORACLE':True,
                  'ONCHAIN_CONTEXT_NOT_STANDALONE_SIGNAL':True,'ONCHAIN_SCORE_REQUIRES_QUALITY_GATE':True,
                  'ONCHAIN_MIN_COVERAGE_PCT':40,'ONCHAIN_MIN_DIRECTIONAL_VOTES':2,'MISSING_ONCHAIN_DATA_NOT_IMPUTED':True,
                  'LONG_AND_TACTICAL_USE_SEPARATE_FLOW_HORIZONS':True,
              }
          }
          (R/'ALT_ENGINE_MASTER_CHECKPOINT.json').write_text(json.dumps(out,indent=2,ensure_ascii=False),encoding='utf-8')
          df.to_csv(R/'ALT_ENGINE_MASTER_COCKPIT.csv',index=False)
          print(json.dumps(out,indent=2,ensure_ascii=False))
          PY

      - name: Commit master checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crypto_data_hub/ALT_ENGINE_MASTER_CHECKPOINT.json crypto_data_hub/ALT_ENGINE_MASTER_COCKPIT.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Update V8 alt engine master checkpoint'
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then exit 0; fi
              echo "Push attempt $attempt failed; retrying"
              sleep $((attempt * 4))
            done
            echo 'Push failed after 3 attempts'
            exit 1
          fi
