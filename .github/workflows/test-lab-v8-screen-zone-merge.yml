name: TEST LAB V8 Screen Zone Merge

on:
  workflow_dispatch:
  push:
    paths:
      - 'config/alt_zones_screen_2026-09-23.csv'
      - 'scripts/v8_merge_screen_zones.py'
      - '.github/workflows/test-lab-v8-screen-zone-merge.yml'

permissions:
  contents: write

concurrency:
  group: v8-screen-zone-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Biblioteki
        run: pip install --quiet pandas
      - name: Scal i sprawdź 77 z 77
        run: python scripts/v8_merge_screen_zones.py
      - name: Zapisz wynik
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/alt_zones.csv config/alt_zone_migration.csv audit/V8_ZONE_FINAL_77_OF_77.csv audit/V8_ZONE_FINAL_77_OF_77.json audit/V8_ZONE_FINAL_77_OF_77.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Domknij V8 strefy 77 z 77'
          git pull --rebase origin main
          git push origin main
