name: TEST LAB V10 Full System Audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/v10_full_system_audit.py'
      - '.github/workflows/test-lab-v10-full-system-audit.yml'
      - 'google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt'
      - 'config/alt_universe.csv'
      - 'config/tactical_universe.csv'
      - 'config/alt_zones.csv'
      - 'crypto_data_hub/ALT_ENGINE_MASTER_CHECKPOINT.json'
      - 'tactical_engine/TACTICAL_ENGINE.json'
      - 'morning_radar/MORNING_RADAR.json'

permissions:
  contents: write

concurrency:
  group: v10-full-system-audit
  cancel-in-progress: false

jobs:
  full-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apps Script syntax check
        run: |
          cp google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt /tmp/v10.js
          node --check /tmp/v10.js

      - name: Apps Script lint diagnostic
        continue-on-error: true
        run: |
          npx --yes eslint@8.57.1 --no-eslintrc --env es6 \
            --parser-options '{"ecmaVersion":2021}' \
            --rule 'no-redeclare:error' \
            /tmp/v10.js

      - name: Python source compile check
        run: |
          python -m compileall -q scripts

      - name: Run full V10 system audit
        continue-on-error: true
        run: python scripts/v10_full_system_audit.py

      - name: Second independent structure pass
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt').read_text(encoding='utf-8')
          required=['ODSWIEZ_WSZYSTKO','ODSWIEZ_PORANNY_BRIEF','V8_SETUP','SPRAWDZ_EKSTREMA']
          print('required counts:', {fn:len(re.findall(r'function\\s+'+re.escape(fn)+r'\\s*\\(',s)) for fn in required})
          print('K1 dependency:', "getRange('K1')" in s or 'getRange("K1")' in s)
          PY

      - name: Commit audit report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/V10_FULL_SYSTEM_AUDIT.json audit/V10_FULL_SYSTEM_AUDIT.md || true
          if ! git diff --cached --quiet; then
            git commit -m 'Update V10 full system audit'
            git pull --rebase origin main
            git push origin main
          fi

# Triggered after robust CSV rebuild-on-merges hardening.
