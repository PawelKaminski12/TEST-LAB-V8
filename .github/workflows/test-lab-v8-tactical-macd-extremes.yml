name: TEST LAB V8 Tactical MACD Extremes

# V8 TACTICAL MACD EXTREMES v0.5 — relative to each asset's own history
# Pipeline: base TACTICAL v0.4 -> MACD v0.5 -> confluence v0.6 -> readiness
on:
  workflow_dispatch:
  push:
    paths:
      - 'tactical_engine/TACTICAL_QA.csv'
      - '.github/workflows/test-lab-v8-tactical-macd-extremes.yml'

permissions:
  contents: write

concurrency:
  group: v8-tactical-macd-extremes-writes
  cancel-in-progress: false

jobs:
  build-macd-extremes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet pandas numpy

      - name: Add relative MACD extremes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import pandas as pd

          ROOT=Path('tactical_engine')
          ENGINE=ROOT/'TACTICAL_ENGINE.json'
          if not ENGINE.exists():
              raise SystemExit('TACTICAL_ENGINE.json missing')

          LOOKBACK=250
          WARN_P_HIGH=95.0
          EXTREME_P_HIGH=97.5
          WARN_P_LOW=5.0
          EXTREME_P_LOW=2.5
          WARN_Z=1.75
          EXTREME_Z=2.0

          def ema(s,n):
              return s.ewm(span=n,adjust=False,min_periods=n).mean()

          def macd_hist(close):
              macd=ema(close,12)-ema(close,26)
              sig=ema(macd,9)
              return macd-sig

          def classify(hist):
              clean=hist.dropna().reset_index(drop=True)
              if len(clean)<80:
                  return {
                      'macd_hist_percentile':None,
                      'macd_hist_zscore':None,
                      'macd_extreme_label':'NO_DATA',
                      'macd_extreme_warning':False,
                      'macd_extreme':False,
                      'macd_extreme_direction':'NONE',
                      'macd_extreme_lookback':int(len(clean))
                  }
              current=float(clean.iloc[-1])
              hist_ref=clean.iloc[max(0,len(clean)-LOOKBACK-1):-1]
              if len(hist_ref)<60:
                  hist_ref=clean.iloc[:-1]
              mean=float(hist_ref.mean())
              std=float(hist_ref.std(ddof=0))
              z=(current-mean)/std if std>0 else 0.0
              pct=float((hist_ref<=current).mean()*100.0)

              if pct>=EXTREME_P_HIGH and z>=EXTREME_Z:
                  label='EXTREME_POSITIVE'; warn=True; extreme=True; direction='POSITIVE'
              elif pct<=EXTREME_P_LOW and z<=-EXTREME_Z:
                  label='EXTREME_NEGATIVE'; warn=True; extreme=True; direction='NEGATIVE'
              elif pct>=WARN_P_HIGH or z>=WARN_Z:
                  label='WARNING_POSITIVE'; warn=True; extreme=False; direction='POSITIVE'
              elif pct<=WARN_P_LOW or z<=-WARN_Z:
                  label='WARNING_NEGATIVE'; warn=True; extreme=False; direction='NEGATIVE'
              else:
                  label='NORMAL'; warn=False; extreme=False; direction='NONE'

              return {
                  'macd_hist_percentile':pct,
                  'macd_hist_zscore':float(z),
                  'macd_extreme_label':label,
                  'macd_extreme_warning':warn,
                  'macd_extreme':extreme,
                  'macd_extreme_direction':direction,
                  'macd_extreme_lookback':int(len(hist_ref))
              }

          data=json.loads(ENGINE.read_text(encoding='utf-8'))
          source_engine=str(data.get('engine',''))
          if source_engine != 'V8_TACTICAL_ENGINE_v0.4':
              raise SystemExit(f'EXPECTED BASE V0.4, GOT {source_engine}')

          all_ok=True
          for asset in data.get('assets',[]):
              if asset.get('qa')!='PASS':
                  continue
              pair=str(asset.get('pair','')).upper().strip()
              for tf in ['1H','4H','1D']:
                  fp=ROOT/f'{pair}_{tf}.csv'
                  if not fp.exists():
                      all_ok=False
                      continue
                  df=pd.read_csv(fp)
                  close=pd.to_numeric(df['close'],errors='coerce').dropna()
                  ext=classify(macd_hist(close))
                  st=(asset.get('timeframes') or {}).get(tf)
                  if st is None or st.get('mfi14') is None:
                      all_ok=False
                      continue
                  st.update(ext)
                  flags=st.setdefault('extreme_flags',[])
                  flags=[f for f in flags if not str(f).startswith('MACD_')]
                  if ext['macd_extreme_label'] not in ['NORMAL','NO_DATA']:
                      flags.append('MACD_'+ext['macd_extreme_label'])
                  st['extreme_flags']=flags

              summary=[]
              for tf in ['1H','4H','1D']:
                  st=(asset.get('timeframes') or {}).get(tf,{})
                  for flag in st.get('extreme_flags',[]):
                      summary.append(f'{tf}:{flag}')
              asset['extreme_summary']=summary

          data['engine']='V8_TACTICAL_ENGINE_v0.5'
          rules=data.setdefault('rules',{})
          rules['macd_extremes_relative_to_own_history']=True
          rules['macd_extreme_lookback_bars']=LOOKBACK
          rules['macd_warning_percentiles']=[WARN_P_LOW,WARN_P_HIGH]
          rules['macd_extreme_percentiles']=[EXTREME_P_LOW,EXTREME_P_HIGH]
          rules['macd_warning_abs_zscore']=WARN_Z
          rules['macd_extreme_abs_zscore']=EXTREME_Z
          rules['macd_extreme_is_context_not_standalone_trade_signal']=True
          ENGINE.write_text(json.dumps(data,indent=2,ensure_ascii=False),encoding='utf-8')

          rows=[]
          for asset in data.get('assets',[]):
              if asset.get('qa')!='PASS':
                  continue
              for tf in ['1H','4H','1D']:
                  st=(asset.get('timeframes') or {}).get(tf,{})
                  rows.append({
                      'symbol':asset.get('symbol'),
                      'timeframe':tf,
                      'macd_hist':st.get('macd_hist'),
                      'macd_hist_percentile':st.get('macd_hist_percentile'),
                      'macd_hist_zscore':st.get('macd_hist_zscore'),
                      'macd_extreme_label':st.get('macd_extreme_label'),
                      'macd_extreme_warning':st.get('macd_extreme_warning'),
                      'macd_extreme':st.get('macd_extreme'),
                      'lookback':st.get('macd_extreme_lookback')
                  })
          pd.DataFrame(rows).to_csv(ROOT/'TACTICAL_MACD_EXTREMES.csv',index=False)

          if not all_ok:
              raise SystemExit('MACD EXTREME LAYER DATA GAP')
          PY

      - name: Commit MACD extreme outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tactical_engine/TACTICAL_ENGINE.json tactical_engine/TACTICAL_MACD_EXTREMES.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Update V8 tactical MACD relative extremes'
            git pull --rebase origin main
            git push
          fi