name: TEST LAB V8 Onchain Activity

on:
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * *'
  push:
    paths:
      - '.github/workflows/test-lab-v8-onchain-activity.yml'
      - 'config/alt_universe.csv'

permissions:
  contents: write

concurrency:
  group: v8-onchain-activity-writes
  cancel-in-progress: false

jobs:
  build-onchain-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet pandas requests

      - name: Build onchain activity layer
        run: |
          python - <<'PY'
          import json, math, time
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          import pandas as pd
          import requests

          OUT=Path('crypto_data_hub')
          OUT.mkdir(exist_ok=True)
          CFG=Path('config/alt_universe.csv')
          cfg=pd.read_csv(CFG)
          cfg=cfg[cfg['enabled'].astype(str).str.lower().eq('true')].copy()

          ASSET_MAP={
              'ETH': {'cm':'eth','chain':'Ethereum','protocol':None},
              'SOL': {'cm':'sol','chain':'Solana','protocol':None},
              'LINK': {'cm':'link','chain':None,'protocol':None},
              'ONDO': {'cm':'ondo','chain':None,'protocol':'ondo-finance'},
          }
          METRICS=['AdrActCnt','TxCnt','TxTfrValAdjUSD']
          CM='https://community-api.coinmetrics.io/v4/timeseries/asset-metrics'
          LLAMA='https://api.llama.fi'
          session=requests.Session()
          session.headers.update({'User-Agent':'TEST-LAB-V8/1.1'})
          end=datetime.now(timezone.utc)
          start=end-timedelta(days=45)

          def pct(a,b):
              if a is None or b in (None,0): return None
              try: return (float(a)/float(b)-1.0)*100.0
              except Exception: return None

          def safe_float(v):
              try:
                  x=float(v)
                  return x if math.isfinite(x) else None
              except Exception: return None

          def trend_label(v7,v30):
              vals=[v for v in [v7,v30] if v is not None]
              if not vals: return 'NO_DATA'
              avg=sum(vals)/len(vals)
              if avg>=10: return 'STRONG_RISING'
              if avg>=2: return 'RISING'
              if avg<=-10: return 'STRONG_FALLING'
              if avg<=-2: return 'FALLING'
              return 'FLAT'

          def cm_series(asset):
              params={
                  'assets':asset,
                  'metrics':','.join(METRICS),
                  'frequency':'1d',
                  'start_time':start.isoformat().replace('+00:00','Z'),
                  'end_time':end.isoformat().replace('+00:00','Z'),
                  'page_size':10000,
              }
              try:
                  r=session.get(CM,params=params,timeout=20)
                  if r.status_code!=200:
                      return pd.DataFrame(), f'HTTP_{r.status_code}'
                  data=r.json().get('data',[])
                  if not data: return pd.DataFrame(), 'NO_DATA'
                  df=pd.DataFrame(data)
                  df['time']=pd.to_datetime(df['time'],utc=True,errors='coerce')
                  for m in METRICS:
                      if m in df.columns: df[m]=pd.to_numeric(df[m],errors='coerce')
                  return df.sort_values('time'), 'OK'
              except Exception as e:
                  return pd.DataFrame(), 'ERROR_'+type(e).__name__

          def llama_tvl(chain):
              if not chain: return pd.DataFrame(), 'NOT_APPLICABLE'
              try:
                  r=session.get(f'{LLAMA}/v2/historicalChainTvl/{chain}',timeout=20)
                  if r.status_code!=200: return pd.DataFrame(), f'HTTP_{r.status_code}'
                  data=r.json()
                  if not isinstance(data,list) or not data: return pd.DataFrame(), 'NO_DATA'
                  df=pd.DataFrame(data)
                  df['date']=pd.to_datetime(df['date'],unit='s',utc=True,errors='coerce')
                  df['tvl']=pd.to_numeric(df['tvl'],errors='coerce')
                  return df.dropna(subset=['date','tvl']).sort_values('date').tail(90), 'OK'
              except Exception as e:
                  return pd.DataFrame(), 'ERROR_'+type(e).__name__

          def llama_dex(chain):
              if not chain: return pd.DataFrame(), 'NOT_APPLICABLE'
              try:
                  url=f'{LLAMA}/overview/dexs/{chain}'
                  params={'excludeTotalDataChart':'false','excludeTotalDataChartBreakdown':'true','dataType':'dailyVolume'}
                  r=session.get(url,params=params,timeout=20)
                  if r.status_code!=200: return pd.DataFrame(), f'HTTP_{r.status_code}'
                  obj=r.json(); chart=obj.get('totalDataChart') or []
                  rows=[]
                  for x in chart:
                      if isinstance(x,list) and len(x)>=2: rows.append({'date':x[0],'volume':x[1]})
                  if not rows: return pd.DataFrame(), 'NO_DATA'
                  df=pd.DataFrame(rows)
                  df['date']=pd.to_datetime(df['date'],unit='s',utc=True,errors='coerce')
                  df['volume']=pd.to_numeric(df['volume'],errors='coerce')
                  return df.dropna(subset=['date','volume']).sort_values('date').tail(90), 'OK'
              except Exception as e:
                  return pd.DataFrame(), 'ERROR_'+type(e).__name__

          def llama_protocol_tvl(slug):
              if not slug: return pd.DataFrame(), 'NOT_APPLICABLE'
              try:
                  r=session.get(f'{LLAMA}/protocol/{slug}',timeout=20)
                  if r.status_code!=200: return pd.DataFrame(), f'HTTP_{r.status_code}'
                  obj=r.json(); hist=obj.get('tvl') or []
                  rows=[]
                  for x in hist:
                      if isinstance(x,dict) and x.get('date') is not None:
                          val=x.get('totalLiquidityUSD')
                          if val is not None: rows.append({'date':x.get('date'),'tvl':val})
                  if not rows: return pd.DataFrame(), 'NO_DATA'
                  df=pd.DataFrame(rows)
                  df['date']=pd.to_datetime(df['date'],unit='s',utc=True,errors='coerce')
                  df['tvl']=pd.to_numeric(df['tvl'],errors='coerce')
                  return df.dropna(subset=['date','tvl']).sort_values('date').tail(90), 'OK'
              except Exception as e:
                  return pd.DataFrame(), 'ERROR_'+type(e).__name__

          def point_change(s,days):
              s=s.dropna()
              if len(s)<2: return None
              cur=float(s.iloc[-1]); idx=max(0,len(s)-1-days); old=float(s.iloc[idx])
              return pct(cur,old)

          def sum_change(s,days):
              s=s.dropna()
              if len(s)<days*2: return None
              recent=float(s.iloc[-days:].sum()); prev=float(s.iloc[-2*days:-days].sum())
              return pct(recent,prev)

          def tvl_block(df):
              out={'latest_usd':None,'change_7d_pct':None,'change_30d_pct':None,'trend':'NO_DATA'}
              if df.empty: return out
              s=df['tvl'].dropna()
              if s.empty: return out
              c7=point_change(s,7); c30=point_change(s,30)
              return {'latest_usd':safe_float(s.iloc[-1]),'change_7d_pct':c7,'change_30d_pct':c30,'trend':trend_label(c7,c30)}

          def context(votes):
              votes=[v for v in votes if v is not None]
              if not votes: return {'score':None,'label':'NO_DATA'}
              pos=sum(v>2 for v in votes); neg=sum(v<-2 for v in votes); n=len(votes)
              score=round((pos-neg+n)/(2*n)*10); score=max(0,min(10,score))
              label='STRONG_POSITIVE' if score>=8 else 'POSITIVE' if score>=6 else 'NEUTRAL' if score>=4 else 'NEGATIVE' if score>=2 else 'STRONG_NEGATIVE'
              return {'score':score,'label':label}

          assets=[]; raw_rows=[]
          symbols=[str(x).upper().strip() for x in cfg['symbol'].tolist() if str(x).upper().strip() in ASSET_MAP]
          for sym in symbols:
              meta=ASSET_MAP[sym]
              cm,cm_status=cm_series(meta['cm'])
              tvl,tvl_status=llama_tvl(meta['chain'])
              dex,dex_status=llama_dex(meta['chain'])
              protocol,protocol_status=llama_protocol_tvl(meta['protocol'])

              metrics={}
              for m in METRICS:
                  if m in cm.columns and cm[m].notna().any():
                      ss=cm[m].dropna(); c7=point_change(ss,7); c30=point_change(ss,30)
                      metrics[m]={'latest':safe_float(ss.iloc[-1]),'change_7d_pct':c7,'change_30d_pct':c30,'trend':trend_label(c7,c30)}
                  else:
                      metrics[m]={'latest':None,'change_7d_pct':None,'change_30d_pct':None,'trend':'NO_DATA'}

              chain_tvl=tvl_block(tvl)
              protocol_tvl=tvl_block(protocol)

              dex_block={'latest_daily_usd':None,'change_7d_vs_prev7_pct':None,'change_30d_vs_prev30_pct':None,'trend':'NO_DATA'}
              if not dex.empty:
                  s=dex['volume'].dropna(); c7=sum_change(s,7); c30=sum_change(s,30)
                  if not s.empty:
                      dex_block={'latest_daily_usd':safe_float(s.iloc[-1]),'change_7d_vs_prev7_pct':c7,'change_30d_vs_prev30_pct':c30,'trend':trend_label(c7,c30)}

              possible=3; available=sum(metrics[m]['latest'] is not None for m in METRICS)
              if meta['chain']:
                  possible+=2; available+=int(chain_tvl['latest_usd'] is not None)+int(dex_block['latest_daily_usd'] is not None)
              if meta['protocol']:
                  possible+=1; available+=int(protocol_tvl['latest_usd'] is not None)
              coverage=round(available/possible*100) if possible else 0

              long_votes=[metrics[m]['change_30d_pct'] for m in METRICS]
              tactical_votes=[metrics[m]['change_7d_pct'] for m in METRICS]
              long_votes += [chain_tvl['change_30d_pct'],dex_block['change_30d_vs_prev30_pct'],protocol_tvl['change_30d_pct']]
              tactical_votes += [chain_tvl['change_7d_pct'],dex_block['change_7d_vs_prev7_pct'],protocol_tvl['change_7d_pct']]
              lc=context(long_votes); tc=context(tactical_votes)

              asset={
                  'symbol':sym,'coinmetrics_asset':meta['cm'],'defillama_chain':meta['chain'],'defillama_protocol':meta['protocol'],
                  'source_status':{'coinmetrics':cm_status,'defillama_chain_tvl':tvl_status,'defillama_dex':dex_status,'defillama_protocol_tvl':protocol_status},
                  'coverage_pct':coverage,'network_metrics':metrics,
                  'chain_tvl':chain_tvl,'protocol_tvl':protocol_tvl,'dex_volume':dex_block,
                  'long_onchain_score_0_10':lc['score'],'long_onchain_label':lc['label'],
                  'tactical_onchain_score_0_10':tc['score'],'tactical_onchain_label':tc['label'],
                  'role':'context only; never standalone trade signal',
              }
              assets.append(asset)
              raw_rows.append({
                  'date':end.date().isoformat(),'symbol':sym,'coverage_pct':coverage,
                  'active_addresses':metrics['AdrActCnt']['latest'],'active_addresses_7d_pct':metrics['AdrActCnt']['change_7d_pct'],'active_addresses_30d_pct':metrics['AdrActCnt']['change_30d_pct'],
                  'tx_count':metrics['TxCnt']['latest'],'tx_count_7d_pct':metrics['TxCnt']['change_7d_pct'],'tx_count_30d_pct':metrics['TxCnt']['change_30d_pct'],
                  'transfer_value_adj_usd':metrics['TxTfrValAdjUSD']['latest'],'transfer_value_7d_pct':metrics['TxTfrValAdjUSD']['change_7d_pct'],'transfer_value_30d_pct':metrics['TxTfrValAdjUSD']['change_30d_pct'],
                  'chain_tvl_usd':chain_tvl['latest_usd'],'chain_tvl_7d_pct':chain_tvl['change_7d_pct'],'chain_tvl_30d_pct':chain_tvl['change_30d_pct'],
                  'protocol_tvl_usd':protocol_tvl['latest_usd'],'protocol_tvl_7d_pct':protocol_tvl['change_7d_pct'],'protocol_tvl_30d_pct':protocol_tvl['change_30d_pct'],
                  'dex_daily_usd':dex_block['latest_daily_usd'],'dex_7d_vs_prev7_pct':dex_block['change_7d_vs_prev7_pct'],'dex_30d_vs_prev30_pct':dex_block['change_30d_vs_prev30_pct'],
                  'long_onchain_score_0_10':lc['score'],'long_onchain_label':lc['label'],'tactical_onchain_score_0_10':tc['score'],'tactical_onchain_label':tc['label'],
              })
              time.sleep(0.25)

          coverage_assets=sum(a['coverage_pct']>0 for a in assets)
          source_health={
              'defillama_chain_assets_ok':sum(a['source_status']['defillama_chain_tvl']=='OK' for a in assets),
              'defillama_dex_assets_ok':sum(a['source_status']['defillama_dex']=='OK' for a in assets),
              'defillama_protocol_assets_ok':sum(a['source_status']['defillama_protocol_tvl']=='OK' for a in assets),
              'coinmetrics_assets_ok':sum(a['source_status']['coinmetrics']=='OK' for a in assets),
          }
          payload={
              'generated_at_utc':end.isoformat(),'engine':'ONCHAIN_ACTIVITY_v0.2','assets':assets,
              'summary':{'assets_requested':len(assets),'assets_with_any_data':coverage_assets,'source_health':source_health,'coinmetrics_metrics':METRICS,'defillama_layers':['CHAIN_TVL','DEX_VOLUME','PROTOCOL_TVL']},
              'hard_rules':{
                  'onchain_is_context_not_signal':True,'missing_data_is_never_imputed':True,'network_metrics_not_equal_token_fundamentals':True,
                  'exchange_netflow_not_claimed_without_verified_source':True,'whale_flow_not_claimed_without_verified_source':True,'V7_UNTOUCHED':True,
              },
              'limitations':[
                  'Coin Metrics community time-series access is currently unavailable from this runner for some assets; HTTP errors are surfaced, never hidden.',
                  'ETH/SOL chain TVL and DEX activity describe their networks, not solely the token investment case.',
                  'ONDO protocol TVL is tracked separately from chain TVL.',
                  'Verified exchange netflow and whale-wallet flow remain pending until a reliable source is connected.',
                  'Missing LINK/ONDO network-address metrics are not guessed or replaced with unrelated proxies.'
              ]
          }
          (OUT/'ONCHAIN_ACTIVITY.json').write_text(json.dumps(payload,indent=2,ensure_ascii=False),encoding='utf-8')
          df=pd.DataFrame(raw_rows); df.to_csv(OUT/'ONCHAIN_ACTIVITY.csv',index=False)
          hf=OUT/'ONCHAIN_ACTIVITY_HISTORY.csv'
          if hf.exists() and not df.empty:
              old=pd.read_csv(hf); df=pd.concat([old,df],ignore_index=True).drop_duplicates(['date','symbol'],keep='last').sort_values(['date','symbol'])
          df.to_csv(hf,index=False)
          print(json.dumps(payload,indent=2,ensure_ascii=False))
          PY

      - name: Commit onchain outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crypto_data_hub/ONCHAIN_ACTIVITY.json crypto_data_hub/ONCHAIN_ACTIVITY.csv crypto_data_hub/ONCHAIN_ACTIVITY_HISTORY.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Update V8 onchain activity layer'
            git pull --rebase origin main
            git push
          fi
