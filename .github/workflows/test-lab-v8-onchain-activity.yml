name: TEST LAB V8 Onchain Activity

on:
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * *'
  push:
    paths:
      - '.github/workflows/test-lab-v8-onchain-activity.yml'
      - 'scripts/v8_onchain_activity.py'
      - 'config/alt_universe.csv'

permissions:
  contents: write

concurrency:
  group: v8-onchain-activity-writes
  cancel-in-progress: false

jobs:
  build-onchain-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet pandas requests

      - name: Build onchain activity layer
        run: python scripts/v8_onchain_activity.py

      - name: Commit onchain outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crypto_data_hub/ONCHAIN_ACTIVITY.json crypto_data_hub/ONCHAIN_ACTIVITY.csv crypto_data_hub/ONCHAIN_ACTIVITY_HISTORY.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Update V8 onchain activity layer'
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then exit 0; fi
              echo "Push attempt $attempt failed; retrying"
              sleep $((attempt * 4))
            done
            echo 'Push failed after 3 attempts'
            exit 1
          fi
