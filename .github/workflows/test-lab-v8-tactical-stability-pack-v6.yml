name: TEST LAB V8 Tactical Stability Pack V6

on:
  push:
    paths:
      - 'scripts/v8_tactical_stability_pack_v6.py'
      - 'tactical_validation/TACTICAL_META_GATE_V5_HISTORY.csv'
      - '.github/workflows/test-lab-v8-tactical-stability-pack-v6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stability-v6:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Zapamiętaj produkcję
        run: |
          sha256sum tactical_engine/TACTICAL_ENGINE.json > /tmp/prod_before.sha
          sha256sum google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V9.txt >> /tmp/prod_before.sha
      - name: Sprawdź składnię Stability Pack V6
        run: python -m py_compile scripts/v8_tactical_stability_pack_v6.py
      - name: Uruchom Stability Pack V6
        run: python scripts/v8_tactical_stability_pack_v6.py
      - name: Sprawdź kontrakt bezpieczeństwa i strukturę
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('tactical_validation/TACTICAL_STABILITY_PACK_V6.json').read_text(encoding='utf-8'))
          assert p['research_only'] is True
          assert p['deploy_block'] is True
          assert p['auto_execution'] is False
          assert p['production_modified'] is False
          assert p['source_allow_rows'] >= 200
          assert len(p['rolling_windows']) == 8
          assert len(p['expanding_folds']) == 3
          assert len(p['validation_gates']) == 9
          print('SAFETY + STRUCTURE PASS')
          PY
      - name: Potwierdź brak zmian produkcyjnych
        run: |
          sha256sum tactical_engine/TACTICAL_ENGINE.json > /tmp/prod_after.sha
          sha256sum google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V9.txt >> /tmp/prod_after.sha
          diff -u /tmp/prod_before.sha /tmp/prod_after.sha
      - name: Final readiness
        run: python scripts/v8_final_readiness.py
      - name: Pełny audyt 1 z 2
        run: python scripts/v8_full_double_audit_v2.py --pass-number 1
      - name: Pełny audyt 2 z 2
        run: python scripts/v8_full_double_audit_v2.py --pass-number 2
      - name: Zapisz Stability Pack V6 i audyty
        run: |
          git config user.name 'PawelKaminski12'
          git config user.email 'pkaminski1@gmail.com'
          git add tactical_validation/TACTICAL_STABILITY_PACK_V6.json tactical_validation/TACTICAL_STABILITY_PACK_V6_WINDOWS.csv audit/V8_TACTICAL_STABILITY_PACK_V6.md audit/V8_FINAL_READINESS.json audit/V8_FINAL_READINESS_LATEST.md audit/V8_FULL_AUDIT_PASS_1.json audit/V8_FULL_AUDIT_PASS_1.md audit/V8_FULL_AUDIT_PASS_2.json audit/V8_FULL_AUDIT_PASS_2.md google_sheets/V8_FINAL_READINESS.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'Brak zmian do zapisu'
          else
            git commit -m 'Zapisz wyniki Tactical Stability Pack V6'
            git push
          fi
