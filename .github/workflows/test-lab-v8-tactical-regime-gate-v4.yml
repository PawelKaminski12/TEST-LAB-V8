name: TEST LAB V8 Tactical Regime Gate V4

on:
  push:
    paths:
      - 'scripts/v8_tactical_regime_gate_v4.py'
      - 'tactical_validation/TACTICAL_WALKFORWARD_OBSERVATIONS.csv'
      - 'tactical_validation/TACTICAL_CHALLENGER_MATRIX_V3.json'
      - 'tactical_engine/TACTICAL_ENGINE.json'
      - '.github/workflows/test-lab-v8-tactical-regime-gate-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regime-gate-v4:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zapamiętaj produkcję
        run: |
          sha256sum tactical_engine/TACTICAL_ENGINE.json > /tmp/prod_before.sha
          sha256sum google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V9.txt >> /tmp/prod_before.sha

      - name: Sprawdź składnię Regime Gate V4
        run: python -m py_compile scripts/v8_tactical_regime_gate_v4.py

      - name: Uruchom Regime Gate V4
        run: python scripts/v8_tactical_regime_gate_v4.py

      - name: Sprawdź kontrakt bezpieczeństwa i kompletność
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p=json.loads(Path('tactical_validation/TACTICAL_REGIME_GATE_V4.json').read_text(encoding='utf-8'))
          c=json.loads(Path('tactical_validation/TACTICAL_REGIME_GATE_CURRENT.json').read_text(encoding='utf-8'))
          assert p['research_only'] is True
          assert p['deploy_block'] is True
          assert p['auto_execution'] is False
          assert p['production_modified'] is False
          assert p['manual_promotion_only'] is True
          assert p['source_rows'] >= 500
          assert p['challenger'] == 'BALANCED_LOW_FOMO'
          assert p['current']['status'] in {'ACTIVE','CAUTION','BLOCK'}
          assert set(p['historical_by_gate']) == {'ACTIVE','CAUTION','BLOCK'}
          assert len(p['validation_gates']) == 7
          assert c['research_only'] is True and c['deploy_block'] is True
          rows=list(csv.DictReader(Path('tactical_validation/TACTICAL_REGIME_GATED_SHADOW_CURRENT.csv').open(encoding='utf-8')))
          assert len(rows) == 13
          assert all(r['regime_gate'] in {'ACTIVE','CAUTION','BLOCK'} for r in rows)
          print('REGIME GATE SAFETY + STRUCTURE PASS')
          PY

      - name: Potwierdź brak zmian produkcyjnych
        run: |
          sha256sum tactical_engine/TACTICAL_ENGINE.json > /tmp/prod_after.sha
          sha256sum google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V9.txt >> /tmp/prod_after.sha
          diff -u /tmp/prod_before.sha /tmp/prod_after.sha

      - name: Final readiness
        run: python scripts/v8_final_readiness.py

      - name: Pełny audyt 1 z 2
        run: python scripts/v8_full_double_audit_v2.py --pass-number 1

      - name: Pełny audyt 2 z 2
        run: python scripts/v8_full_double_audit_v2.py --pass-number 2

      - name: Zapisz Regime Gate V4 i audyty
        run: |
          git config user.name 'PawelKaminski12'
          git config user.email 'pkaminski1@gmail.com'
          git add tactical_validation/TACTICAL_REGIME_GATE_V4.json tactical_validation/TACTICAL_REGIME_GATE_CURRENT.json tactical_validation/TACTICAL_REGIME_GATED_SHADOW_CURRENT.csv tactical_validation/TACTICAL_REGIME_GATE_V4_HISTORY.csv audit/V8_TACTICAL_REGIME_GATE_V4.md audit/V8_FINAL_READINESS.json audit/V8_FINAL_READINESS_LATEST.md audit/V8_FULL_AUDIT_PASS_1.json audit/V8_FULL_AUDIT_PASS_1.md audit/V8_FULL_AUDIT_PASS_2.json audit/V8_FULL_AUDIT_PASS_2.md google_sheets/V8_FINAL_READINESS.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'Brak zmian do zapisu'
          else
            git commit -m 'Zapisz wyniki Tactical Regime Gate V4'
            git push
          fi
