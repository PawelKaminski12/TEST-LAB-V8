name: Patch V10 Stability Restore

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_v10_stability_restore.py'
      - '.github/workflows/patch-v10-stability-restore.yml'

permissions:
  contents: write

concurrency:
  group: v10-stability-restore
  cancel-in-progress: false

jobs:
  patch-v10-stability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply stability restore
        run: python scripts/patch_v10_stability_restore.py

      - name: Validate no global theme calls remain
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt').read_text(encoding='utf-8')
          assert 'applyUnifiedThemeV10_(ss);' not in s
          assert 'applyUnifiedV8Theme_(ss);' not in s
          assert 'function applySafeEngineColorsV10_' in s
          assert 'applySafeEngineColorsV10_(sheet);' in s
          assert 'writeMorningRadarBrief_(sheet, radarJson);' in s
          print('V10 stability validation: OK')
          PY

      - name: Syntax check
        run: |
          cp google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt /tmp/v10.js
          node --check /tmp/v10.js

      - name: Commit patched V10
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt
          if git diff --cached --quiet; then
            echo 'No V10 changes'
            exit 0
          fi
          git commit -m 'Restore V10 stability and use safe table colors'
          git pull --rebase origin main
          git push origin main
