name: Patch V10 Stability Restore

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_v10_stability_restore.py'
      - '.github/workflows/patch-v10-stability-restore.yml'

permissions:
  contents: write

concurrency:
  group: v10-stability-restore
  cancel-in-progress: false

jobs:
  patch-v10-stability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply stability restore
        run: python scripts/patch_v10_stability_restore.py

      - name: Validate stability root fix
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt').read_text(encoding='utf-8')
          assert 'applyUnifiedThemeV10_(ss);' not in s
          assert 'applyUnifiedV8Theme_(ss);' not in s
          assert 'function applySafeEngineColorsV10_' in s
          assert 'writeMorningRadarBrief_(sheet, radarJson);' in s
          assert "getProperty('V10_MORNING_MODE')" in s
          assert "setProperty('V10_MORNING_MODE', mode)" in s
          assert "getRange('K1')" not in s
          assert "sheet.hideColumns(11)" not in s
          assert "sheet.getMergedRanges().forEach(r => r.breakApart());" in s
          assert "sheet.getRange(1, 1, sheet.getMaxRows(), sheet.getMaxColumns()).breakApart();" not in s
          print('PASS 1: exact merged-range unmerge + mode storage OK')
          PY

      - name: Second validation pass
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt').read_text(encoding='utf-8')
          bad = ["getRange('K1')", 'getRange("K1")', 'hideColumns(11)', 'getMaxRows(), sheet.getMaxColumns()).breakApart()']
          hits = [x for x in bad if x in s]
          if hits:
              raise SystemExit('Forbidden unstable dependencies remain: ' + ', '.join(hits))
          for fn in ['setupMorningBrief_','morningRadarModeV10_','onSelectionChange']:
              assert ('function ' + fn) in s
          print('PASS 2: no hidden-cell or broad breakApart dependency remains')
          PY

      - name: Syntax check
        run: |
          cp google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt /tmp/v10.js
          node --check /tmp/v10.js

      - name: Commit patched V10
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt
          if git diff --cached --quiet; then
            echo 'No V10 changes'
            exit 0
          fi
          git commit -m 'Use exact merged ranges in Morning Radar setup'
          git pull --rebase origin main
          git push origin main
