name: Build V10 Panel Pack

on:
  push:
    paths:
      - 'scripts/build_v10_panel_pack.py'
      - 'scripts/patch_v10_morning_ui.py'
      - 'scripts/patch_v10_morning_radar.py'
      - 'scripts/patch_v10_morning_buttons.py'
      - 'scripts/patch_v10_morning_polish.py'
      - 'scripts/patch_v10_morning_legend.py'
      - 'scripts/patch_v10_shared_indicator_language.py'
      - 'scripts/patch_v10_unified_dashboard_theme.py'
      - 'google_sheets/V10_COMPATIBILITY_PATCH.txt'
      - '.github/workflows/build-v10-panel-pack.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build V10
        run: python scripts/build_v10_panel_pack.py

      - name: Apply Morning Brief light dashboard UI
        run: python scripts/patch_v10_morning_ui.py

      - name: Apply Morning Radar 1H 2H 4H AUTO
        run: python scripts/patch_v10_morning_radar.py

      - name: Apply visible manual interval buttons
        run: python scripts/patch_v10_morning_buttons.py

      - name: Apply final Morning Radar polish
        run: python scripts/patch_v10_morning_polish.py

      - name: Apply Morning Radar legend
        run: python scripts/patch_v10_morning_legend.py

      - name: Apply shared indicator language across V8 dashboards
        run: python scripts/patch_v10_shared_indicator_language.py

      - name: Apply unified colors across all V8 dashboards
        run: python scripts/patch_v10_unified_dashboard_theme.py

      - name: Apply Apps Script compatibility fixes in generated V10
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt')
          s = p.read_text(encoding='utf-8')

          fixed = []
          for line in s.splitlines():
              if 'newConditionalFormatRule()' in line and '.setFontWeight(' in line:
                  line = line.replace(".setFontWeight('bold')", '')
                  line = line.replace('.setFontWeight("bold")', '')
              fixed.append(line)
          s = '\n'.join(fixed) + '\n'

          marker = '// ===== V10 COMPATIBILITY FIX — ALARM DIRECTION ====='
          if 'function classifyAlarmDirection_(' not in s:
              s += "\n" + marker + "\nfunction classifyAlarmDirection_(a) {\n  return alarmDirection_(a);\n}\n"

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate required functions and unified V8 UI
        run: |
          FILE=google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt
          grep -q "function alarmDirection_(" "$FILE"
          grep -q "function classifyAlarmDirection_(" "$FILE"
          grep -q "function macdDisplayLabelV10_(" "$FILE"
          grep -q "RSI GÓRNE GRANICE" "$FILE"
          grep -q "RSI DOLNE GRANICE" "$FILE"
          grep -q "MFI GÓRNE GRANICE" "$FILE"
          grep -q "MFI DOLNE GRANICE" "$FILE"
          grep -q "MACD EKSTREMUM + — GÓRNE GRANICE" "$FILE"
          grep -q "MACD EKSTREMUM − — DOLNE GRANICE" "$FILE"
          grep -q "function ODSWIEZ_WSZYSTKO(" "$FILE"
          grep -q "function ODSWIEZ_PORANNY_BRIEF(" "$FILE"
          grep -q "function writeLongDashboard_(" "$FILE"
          grep -q "function writeTacticalDashboard_(" "$FILE"
          grep -q "function writeMorningRadarBrief_(" "$FILE"
          grep -q "function styleMorningRadarBriefV10_(" "$FILE"
          grep -q "function styleMorningRadarButtonsV10_(" "$FILE"
          grep -q "function polishMorningRadarV10_(" "$FILE"
          grep -q "function drawMorningRadarLegendV10_(" "$FILE"
          grep -q "function onSelectionChange(e)" "$FILE"
          grep -q "V10_MORNING_RADAR_URL" "$FILE"
          grep -q "V10_MORNING_RADAR_CACHE" "$FILE"
          grep -q "\['1H','2H','4H','AUTO'\]" "$FILE"
          grep -q "AUTO nie jest średnią" "$FILE"
          grep -q "LEGENDA KOLORÓW" "$FILE"
          grep -q "RADAR 13 ALTÓW" "$FILE"
          grep -q "\['AKTYWO','TF','RSI','MFI','MACD','FOMO','TREND','RADAR','POWÓD'\]" "$FILE"
          grep -q "function applyUnifiedV8Theme_(" "$FILE"
          grep -q "function unifiedSemanticStyleV10_(" "$FILE"
          grep -q "applyUnifiedV8Theme_(ss);" "$FILE"
          grep -q "const V8_UI" "$FILE"
          grep -q "setHiddenGridlines(true)" "$FILE"
          grep -q "setFontFamily('Roboto')" "$FILE"
          grep -q "setRowHeights(20,n,26)" "$FILE"
          if grep "newConditionalFormatRule()" "$FILE" | grep -q "setFontWeight"; then
            echo "Forbidden setFontWeight() remains in ConditionalFormatRule"
            exit 1
          fi

      - name: Syntax check
        run: |
          cp google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt /tmp/v10.js
          node --check /tmp/v10.js

      - name: Commit V10 if changed
        run: |
          if [ -z "$(git status --porcelain -- google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt
          git commit -m "Build V10 with unified dashboard colors"
          git push
