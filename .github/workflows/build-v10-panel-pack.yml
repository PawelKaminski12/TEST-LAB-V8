name: Build V10 Panel Pack

on:
  push:
    paths:
      - 'scripts/build_v10_panel_pack.py'
      - '.github/workflows/build-v10-panel-pack.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build V10
        run: python scripts/build_v10_panel_pack.py

      - name: Commit V10 if changed
        run: |
          if git diff --quiet -- google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt
          git commit -m "Build V10 accepted panels pack"
          git push
