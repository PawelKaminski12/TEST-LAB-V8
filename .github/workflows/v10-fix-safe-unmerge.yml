name: V10 Fix Safe Unmerge

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/v10_fix_safe_unmerge.py'
      - '.github/workflows/v10-fix-safe-unmerge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply safe unmerge patch
        run: python scripts/v10_fix_safe_unmerge.py
      - name: Syntax check
        run: |
          cp google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt /tmp/v10.js
          node --check /tmp/v10.js
      - name: Re-run consolidator invariant
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('c','scripts/v10_consolidate_apps_script.py')
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          s=Path('google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt').read_text(encoding='utf-8')
          counts=m.count_functions(s)
          d={k:v for k,v in counts.items() if v>1}
          assert not d,d
          assert counts.get('unmergeAllSafelyV10_')==1
          print('PASS: clean functions + safe unmerge helper')
          PY
      - name: Commit V10 safe unmerge fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Replace wide breakApart with safe merged-range unmerge'
            git pull --rebase origin main
            git push origin main
          fi
