name: TEST LAB V8 Crypto Data Hub

on:
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * *'
  push:
    paths:
      - '.github/workflows/test-lab-v8-crypto-data-hub.yml'

permissions:
  contents: write

jobs:
  build-crypto-data-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet pandas

      - name: Build crypto data hub
        run: |
          python - <<'PY'
          import csv, io, json, urllib.request, zipfile
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path
          import pandas as pd

          OUT=Path('crypto_data_hub'); OUT.mkdir(exist_ok=True)
          ART=Path('crypto_data_hub_artifact'); ART.mkdir(exist_ok=True)
          UA={'User-Agent':'Mozilla/5.0 TEST-LAB-V8/8A.1'}
          now=datetime.now(timezone.utc)
          target=now.date()-timedelta(days=1)

          def get_bytes(url, timeout=60):
              req=urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.read()

          def get_text(url): return get_bytes(url).decode('utf-8-sig')
          def get_json(url): return json.loads(get_text(url))

          def ts_to_date(raw):
              x=int(raw)
              sec=x/1_000_000 if x>10_000_000_000_000 else x/1_000
              return datetime.fromtimestamp(sec,tz=timezone.utc).date()

          def next_month(d):
              return date(d.year+1,1,1) if d.month==12 else date(d.year,d.month+1,1)

          def parse_binance_zip(blob):
              rows=[]
              with zipfile.ZipFile(io.BytesIO(blob)) as z:
                  text=z.read(z.namelist()[0]).decode('utf-8')
              for rr in csv.reader(io.StringIO(text)):
                  if not rr or not rr[0].isdigit(): continue
                  d=ts_to_date(rr[0])
                  rows.append([d.isoformat(),float(rr[1]),float(rr[2]),float(rr[3]),float(rr[4]),float(rr[5])])
              return rows

          def fetch_symbol(sym,months_back=15):
              start=(target.replace(day=1)-timedelta(days=months_back*31)).replace(day=1)
              cur=start; current_month=target.replace(day=1); rows={}
              mo=ms=do=ds=0
              while cur<current_month:
                  ym=f'{cur.year:04d}-{cur.month:02d}'
                  url=f'https://data.binance.vision/data/spot/monthly/klines/{sym}/1d/{sym}-1d-{ym}.zip'
                  try:
                      for r in parse_binance_zip(get_bytes(url)): rows[r[0]]=r
                      mo+=1
                  except Exception as e:
                      ms+=1; print('MONTH_SKIP',sym,ym,repr(e))
                  cur=next_month(cur)
              d=current_month
              while d<=target:
                  url=f'https://data.binance.vision/data/spot/daily/klines/{sym}/1d/{sym}-1d-{d.isoformat()}.zip'
                  try:
                      for r in parse_binance_zip(get_bytes(url)): rows[r[0]]=r
                      do+=1
                  except Exception as e:
                      ds+=1; print('DAY_SKIP',sym,d.isoformat(),repr(e))
                  d+=timedelta(days=1)
              out=pd.DataFrame([rows[k] for k in sorted(rows)],columns=['Date','Open','High','Low','Close','Volume'])
              meta={'rows':len(out),'start':out.iloc[0]['Date'] if len(out) else None,
                    'end':out.iloc[-1]['Date'] if len(out) else None,
                    'monthly_ok':mo,'monthly_skip':ms,'daily_ok':do,'daily_skip':ds}
              return out,meta

          symbols=['BTCUSDT','ETHUSDT','SOLUSDT','LINKUSDT','AAVEUSDT','HBARUSDT','ONDOUSDT']
          dfs={}; binance_meta={}
          for sym in symbols:
              df,meta=fetch_symbol(sym)
              if len(df)<200: raise SystemExit(f'{sym}: insufficient rows {len(df)}')
              dfs[sym]=df; binance_meta[sym]=meta
              df.to_csv(ART/f'{sym}_1D.csv',index=False)
              print(sym,meta)

          def slope50_up(s,n=20):
              m=s.rolling(50).mean()
              return bool(len(m)>70 and pd.notna(m.iloc[-1]) and pd.notna(m.iloc[-1-n]) and m.iloc[-1]>m.iloc[-1-n])

          base=dfs['BTCUSDT'][['Date','Close']].rename(columns={'Close':'BTC'})
          for sym in ['ETHUSDT','SOLUSDT','LINKUSDT','AAVEUSDT','HBARUSDT','ONDOUSDT']:
              base=base.merge(dfs[sym][['Date','Close']].rename(columns={'Close':sym.replace('USDT','')}),on='Date',how='inner')
          for a in ['ETH','SOL','LINK','AAVE','HBAR','ONDO']:
              base[f'{a}_BTC']=base[a]/base['BTC']
              base[f'{a}_ETH']=base[a]/base['ETH']
          base.to_csv(ART/'RATIOS.csv',index=False)

          ratios={}
          for a in ['ETH','SOL','LINK','AAVE','HBAR','ONDO']:
              for quote in ['BTC','ETH']:
                  if a==quote: continue
                  s=base[f'{a}_{quote}']; m50=s.rolling(50).mean()
                  ratios[f'{a}_{quote}']={
                      'value':float(s.iloc[-1]),
                      'above_sma50':bool(s.iloc[-1]>m50.iloc[-1]),
                      'sma50_rising_20d':slope50_up(s),
                      'change_5d_pct':float((s.iloc[-1]/s.iloc[-6]-1)*100),
                      'change_10d_pct':float((s.iloc[-1]/s.iloc[-11]-1)*100),
                      'change_20d_pct':float((s.iloc[-1]/s.iloc[-21]-1)*100),
                      'change_50d_pct':float((s.iloc[-1]/s.iloc[-51]-1)*100),
                  }

          cg_global=get_json('https://api.coingecko.com/api/v3/global')['data']
          cg_markets=get_json('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=50&page=1&sparkline=false')
          total=float(cg_global['total_market_cap']['usd'])
          btc_dom=float(cg_global['market_cap_percentage']['btc'])
          eth_dom=float(cg_global['market_cap_percentage']['eth'])
          btc_mc=next(float(x['market_cap']) for x in cg_markets if x['id']=='bitcoin')
          eth_mc=next(float(x['market_cap']) for x in cg_markets if x['id']=='ethereum')
          top10_sum=sum(float(x['market_cap'] or 0) for x in cg_markets[:10])
          total3_eq=max(0.0,total-btc_mc-eth_mc)
          others_eq=max(0.0,total-top10_sum)
          others_btc_eq=others_eq/btc_mc if btc_mc else None

          stable_hist=get_json('https://stablecoins.llama.fi/stablecoincharts/all')
          sh=[]
          for x in stable_hist:
              try:
                  dt=datetime.fromtimestamp(int(x['date']),tz=timezone.utc).date()
                  val=float(x['totalCirculatingUSD']['peggedUSD'])
                  sh.append((dt,val))
              except Exception: pass
          sh=sorted(sh)
          def stable_ago(days):
              cutoff=target-timedelta(days=days)
              vals=[v for d,v in sh if d<=cutoff]
              return vals[-1] if vals else None
          stable_now=sh[-1][1] if sh else None
          stable_liq={
              'market_cap_usd':stable_now,
              'change_1d_pct':((stable_now/stable_ago(1)-1)*100) if stable_now and stable_ago(1) else None,
              'change_7d_pct':((stable_now/stable_ago(7)-1)*100) if stable_now and stable_ago(7) else None,
              'change_14d_pct':((stable_now/stable_ago(14)-1)*100) if stable_now and stable_ago(14) else None,
              'change_30d_pct':((stable_now/stable_ago(30)-1)*100) if stable_now and stable_ago(30) else None,
          }

          ETF_MIRROR='https://raw.githubusercontent.com/haturatu/crypto-etf-flow/main'
          def etf_flow(filename,label):
              txt=get_text(f'{ETF_MIRROR}/{filename}')
              df=pd.read_csv(io.StringIO(txt))
              if 'Date' not in df.columns or 'Total' not in df.columns:
                  raise RuntimeError(f'{label}: invalid ETF mirror schema')
              df['Date']=pd.to_datetime(df['Date'],errors='coerce',dayfirst=True)
              df['Total']=pd.to_numeric(df['Total'],errors='coerce').fillna(0.0)
              df=df.dropna(subset=['Date']).sort_values('Date').drop_duplicates('Date',keep='last')
              df.to_csv(ART/f'{label}_ETF_FLOWS.csv',index=False)
              s=df['Total']
              def tsum(n): return float(s.tail(n).sum()) if len(s) else None
              sum5=tsum(5); sum20=tsum(20); sum30=tsum(30)
              prev5=float(s.iloc[-10:-5].sum()) if len(s)>=10 else None
              prev20=float(s.iloc[-40:-20].sum()) if len(s)>=40 else None
              accel5=sum5-prev5 if prev5 is not None else None
              trend='INSUFFICIENT'
              if prev5 is not None:
                  if sum5>0 and accel5>0: trend='INFLOW_ACCELERATING'
                  elif sum5>0: trend='INFLOW_POSITIVE'
                  elif sum5<0 and accel5<0: trend='OUTFLOW_ACCELERATING'
                  elif sum5<0: trend='OUTFLOW_NEGATIVE'
                  else: trend='NEUTRAL'
              return {
                  'last_date':df.iloc[-1]['Date'].date().isoformat() if len(df) else None,
                  'flow_1d_usdm':float(s.iloc[-1]) if len(s) else None,
                  'flow_5d_usdm':sum5,
                  'flow_20d_usdm':sum20,
                  'flow_30d_usdm':sum30,
                  'acceleration_5d_vs_prev5_usdm':accel5,
                  'acceleration_20d_vs_prev20_usdm':sum20-prev20 if prev20 is not None else None,
                  'trend_label':trend,
                  'rows':int(len(df)),
                  'primary_source':'Farside Investors',
                  'transport':'haturatu/crypto-etf-flow mirror (30m refresh from Farside via headless Chrome)'
              }

          btc_etf=etf_flow('etf_btc.csv','BTC')
          eth_etf=etf_flow('etf_eth.csv','ETH')
          sol_etf=etf_flow('etf_sol.csv','SOL')

          def regime(df):
              c=df['Close']; s50=c.rolling(50).mean(); s200=c.rolling(200).mean(); hi=c.rolling(365,min_periods=1).max()
              return {
                  'close':float(c.iloc[-1]),
                  'above_sma50':bool(c.iloc[-1]>s50.iloc[-1]),
                  'above_sma200':bool(c.iloc[-1]>s200.iloc[-1]),
                  'sma50_rising_20d':bool(s50.iloc[-1]>s50.iloc[-21]),
                  'drawdown_365d_pct':float((c.iloc[-1]/hi.iloc[-1]-1)*100),
                  'return_20d_pct':float((c.iloc[-1]/c.iloc[-21]-1)*100)
              }
          btc_reg=regime(dfs['BTCUSDT']); eth_reg=regime(dfs['ETHUSDT'])

          qa={
              'binance_all_end_target':all(m['end']==target.isoformat() for m in binance_meta.values()),
              'binance_min_rows':min(m['rows'] for m in binance_meta.values()),
              'btc_etf_rows':btc_etf['rows'],
              'eth_etf_rows':eth_etf['rows'],
              'sol_etf_rows':sol_etf['rows'],
              'coingecko_total_positive':total>0,
              'stablecoin_history_rows':len(sh),
              'eth_btc_history_rows':int(len(base)),
              'etf_transport':'Farside mirror because direct Farside returned HTTP 403 on GitHub runner'
          }
          qa['PASS']=bool(qa['binance_all_end_target'] and qa['binance_min_rows']>=200 and
                          qa['btc_etf_rows']>100 and qa['eth_etf_rows']>100 and qa['sol_etf_rows']>=3 and
                          qa['coingecko_total_positive'] and qa['stablecoin_history_rows']>100 and qa['eth_btc_history_rows']>200)

          snapshot={
              'generated_at_utc':now.isoformat(),
              'target_date':target.isoformat(),
              'sources':{
                  'prices':'Binance Vision spot 1D archives',
                  'market_cap':'CoinGecko /global + /coins/markets',
                  'etf_flows':'Farside Investors via haturatu/crypto-etf-flow mirror',
                  'stablecoin_liquidity':'DefiLlama stablecoins API'
              },
              'btc_regime':btc_reg,
              'eth_regime':eth_reg,
              'relative_strength':ratios,
              'market_rotation':{
                  'btc_dominance_pct':btc_dom,
                  'eth_dominance_pct':eth_dom,
                  'eth_btc_ratio':ratios['ETH_BTC']['value'],
                  'eth_btc_change_5d_pct':ratios['ETH_BTC']['change_5d_pct'],
                  'eth_btc_change_20d_pct':ratios['ETH_BTC']['change_20d_pct'],
                  'V8_TOTAL3_EQ_usd':total3_eq,
                  'V8_OTHERS_EQ_usd':others_eq,
                  'V8_OTHERS_BTC_EQ_ratio':others_btc_eq,
                  'note':'V8_EQ series are CoinGecko equivalents, not yet certified 1:1 with TradingView TOTAL3/OTHERS.'
              },
              'etf_flows':{'BTC':btc_etf,'ETH':eth_etf,'SOL':sol_etf},
              'stablecoin_liquidity':stable_liq,
              'qa':qa
          }
          (OUT/'LATEST_SNAPSHOT.json').write_text(json.dumps(snapshot,indent=2),encoding='utf-8')
          (ART/'LATEST_SNAPSHOT.json').write_text(json.dumps(snapshot,indent=2),encoding='utf-8')
          (ART/'QA.json').write_text(json.dumps(qa,indent=2),encoding='utf-8')

          hist_path=OUT/'HISTORY.csv'
          row={
              'date':target.isoformat(),
              'btc_close':btc_reg['close'],'eth_close':eth_reg['close'],
              'eth_btc_ratio':ratios['ETH_BTC']['value'],'eth_btc_5d_pct':ratios['ETH_BTC']['change_5d_pct'],'eth_btc_20d_pct':ratios['ETH_BTC']['change_20d_pct'],
              'btc_dom_pct':btc_dom,'eth_dom_pct':eth_dom,
              'v8_total3_eq_usd':total3_eq,'v8_others_btc_eq':others_btc_eq,
              'btc_etf_1d_usdm':btc_etf['flow_1d_usdm'],'btc_etf_5d_usdm':btc_etf['flow_5d_usdm'],'btc_etf_20d_usdm':btc_etf['flow_20d_usdm'],'btc_etf_30d_usdm':btc_etf['flow_30d_usdm'],
              'eth_etf_1d_usdm':eth_etf['flow_1d_usdm'],'eth_etf_5d_usdm':eth_etf['flow_5d_usdm'],'eth_etf_20d_usdm':eth_etf['flow_20d_usdm'],'eth_etf_30d_usdm':eth_etf['flow_30d_usdm'],
              'sol_etf_1d_usdm':sol_etf['flow_1d_usdm'],'sol_etf_5d_usdm':sol_etf['flow_5d_usdm'],'sol_etf_20d_usdm':sol_etf['flow_20d_usdm'],'sol_etf_30d_usdm':sol_etf['flow_30d_usdm'],
              'stablecoin_mcap_usd':stable_now,'stablecoin_7d_pct':stable_liq['change_7d_pct'],'stablecoin_14d_pct':stable_liq['change_14d_pct'],'stablecoin_30d_pct':stable_liq['change_30d_pct'],
              'qa_pass':qa['PASS']
          }
          new=pd.DataFrame([row])
          if hist_path.exists():
              old=pd.read_csv(hist_path)
              new=pd.concat([old,new],ignore_index=True).drop_duplicates('date',keep='last').sort_values('date')
          new.to_csv(hist_path,index=False)
          print(json.dumps(snapshot,indent=2)[:18000])
          if not qa['PASS']: raise SystemExit('CRYPTO DATA HUB QA FAILED')
          PY

      - name: Commit latest snapshot and compact history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crypto_data_hub/LATEST_SNAPSHOT.json crypto_data_hub/HISTORY.csv
          if git diff --cached --quiet; then
            echo 'No snapshot changes to commit'
          else
            git commit -m 'Update V8 crypto data hub snapshot'
            git pull --rebase origin main
            git push
          fi
