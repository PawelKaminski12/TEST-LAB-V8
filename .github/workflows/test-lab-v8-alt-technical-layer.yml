name: TEST LAB V8 Alt Technical Layer

on:
  workflow_dispatch:
  schedule:
    - cron: '40 6 * * *'
  push:
    paths:
      - 'config/alt_universe.csv'
      - 'tactical_engine/TACTICAL_ENGINE.json'
      - '.github/workflows/test-lab-v8-alt-technical-layer.yml'

permissions:
  contents: write

concurrency:
  group: v8-alt-technical-writes
  cancel-in-progress: false

jobs:
  build-alt-technical-layer:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz najnowszy projekt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Przygotuj Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zainstaluj biblioteki
        run: pip install --quiet pandas

      - name: Zbuduj technikę LONG dla 11 altów
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import pandas as pd

          ROOT=Path('crypto_data_hub')
          CFG=Path('config/alt_universe.csv')
          TACT=Path('tactical_engine/TACTICAL_ENGINE.json')
          OUT=ROOT/'ALT_TECHNICAL_LAYER.json'
          HIST=ROOT/'ALT_TECHNICAL_HISTORY.csv'
          expected=['ETH','SOL','LINK','ONDO','RENDER','FLOKI','PEPE','SPX6900','XRP','XLM','HBAR']

          if not CFG.exists() or not TACT.exists():
              raise SystemExit('Brak config/alt_universe.csv lub tactical_engine/TACTICAL_ENGINE.json')

          cfg=pd.read_csv(CFG)
          cfg=cfg[cfg['enabled'].astype(str).str.lower().eq('true')].copy()
          active=[x for x in cfg['symbol'].astype(str).str.upper().tolist() if x!='BTC']
          if active != expected:
              raise SystemExit(f'Nieprawidłowa lista LONG altów: {active}')

          tactical=json.loads(TACT.read_text(encoding='utf-8'))
          if tactical.get('engine')!='V8_TACTICAL_ENGINE_v1.0':
              raise SystemExit('LONG czeka na zwalidowany TACTICAL v1.0')
          tmap={a.get('symbol'):a for a in tactical.get('assets',[]) if a.get('qa')=='PASS'}

          assets=[]
          for sym in expected:
              a=tmap.get(sym)
              if not a:
                  assets.append({'symbol':sym,'qa':'FAIL','reason':'brak zwalidowanych danych 1D'})
                  continue
              d1=(a.get('timeframes') or {}).get('1D') or {}
              required=['close','trend_score_0_4','fomo_score_0_10','volume_ratio_vs_20','breakout_20','retest_10','return_20bars_pct']
              missing=[k for k in required if d1.get(k) is None]
              if missing:
                  assets.append({'symbol':sym,'qa':'FAIL','reason':'brak: '+','.join(missing)})
                  continue
              assets.append({
                  'symbol':sym,
                  'pair':a.get('pair'),
                  'qa':'PASS',
                  'source':'TACTICAL 1D — zamknięta świeca',
                  'source_type':(a.get('source_types') or {}).get('1D'),
                  'close':d1.get('close'),
                  'trend_score_0_4':d1.get('trend_score_0_4'),
                  'above_sma50':None,
                  'above_sma200':None,
                  'sma50_rising_20d':None,
                  'sma50_above_sma200':None,
                  'return_20d_pct':d1.get('return_20bars_pct'),
                  'return_60d_pct':None,
                  'volume_ratio_vs_20d':d1.get('volume_ratio_vs_20'),
                  'fresh_breakout_20d':d1.get('breakout_20'),
                  'retest_confirmed_10d':d1.get('retest_10'),
                  'retest_level':d1.get('retest_level'),
                  'breakout_age_bars':None,
                  'fomo_score_0_10':d1.get('fomo_score_0_10'),
                  'fomo_label':d1.get('fomo_label'),
                  'rsi14':d1.get('rsi14'),
                  'mfi14':d1.get('mfi14'),
                  'macd_hist':d1.get('macd_hist'),
                  'closed_bar_only':d1.get('closed_bar_only'),
                  'last_close_time_utc':d1.get('last_close_time_utc'),
              })

          if any(a.get('qa')!='PASS' for a in assets):
              print(json.dumps(assets,ensure_ascii=False,indent=2))
              raise SystemExit('Nie wszystkie 11 altów mają kompletną warstwę LONG')

          payload={
              'date':datetime.now(timezone.utc).date().isoformat(),
              'generated_at_utc':datetime.now(timezone.utc).isoformat(),
              'engine':'ALT_TECHNICAL_LAYER_v1.0',
              'universe_source':'config/alt_universe.csv',
              'data_source':'tactical_engine/TACTICAL_ENGINE.json — interwał 1D',
              'asset_count':len(assets),
              'rules':{
                  'dynamic_universe':True,
                  'btc_is_market_regime_not_alt_decision_row':True,
                  'closed_1d_only':True,
                  'no_zone_guessing':True,
                  'zones_are_separate_and_required_for_final_long_decision':True,
                  'fomo_is_context_not_standalone_sell_signal':True,
                  'stocks_remain_separate_long_engine_component':True,
                  'execution_connected':False,
              },
              'assets':assets,
          }
          OUT.write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')

          new=pd.DataFrame([{
              'date':payload['date'],'symbol':x['symbol'],'qa':x['qa'],
              'trend_score_0_4':x.get('trend_score_0_4'),
              'fresh_breakout_20d':x.get('fresh_breakout_20d'),
              'retest_confirmed_10d':x.get('retest_confirmed_10d'),
              'fomo_score_0_10':x.get('fomo_score_0_10'),'fomo_label':x.get('fomo_label')
          } for x in assets])
          if HIST.exists():
              old=pd.read_csv(HIST)
              new=pd.concat([old,new],ignore_index=True).drop_duplicates(['date','symbol'],keep='last').sort_values(['date','symbol'])
          new.to_csv(HIST,index=False)
          print('LONG: 11/11 altów ma zwalidowane dane techniczne 1D.')
          PY

      - name: Sprawdź komplet LONG
        run: |
          python - <<'PY'
          import json
          x=json.load(open('crypto_data_hub/ALT_TECHNICAL_LAYER.json'))
          expected=['ETH','SOL','LINK','ONDO','RENDER','FLOKI','PEPE','SPX6900','XRP','XLM','HBAR']
          assert x['engine']=='ALT_TECHNICAL_LAYER_v1.0'
          assert x['asset_count']==11
          assert [a['symbol'] for a in x['assets']]==expected
          assert all(a['qa']=='PASS' and a['closed_bar_only'] is True for a in x['assets'])
          assert x['rules']['execution_connected'] is False
          print('LONG: technika wszystkich 11 altów sprawdzona poprawnie.')
          PY

      - name: Zapisz wynik bez konfliktu
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/longtech
          cp crypto_data_hub/ALT_TECHNICAL_LAYER.json crypto_data_hub/ALT_TECHNICAL_HISTORY.csv /tmp/longtech/
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/longtech/ALT_TECHNICAL_LAYER.json /tmp/longtech/ALT_TECHNICAL_HISTORY.csv crypto_data_hub/
            git add crypto_data_hub/ALT_TECHNICAL_LAYER.json crypto_data_hub/ALT_TECHNICAL_HISTORY.csv
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Update V8 LONG technical layer 11 alts'
            if git push origin main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
