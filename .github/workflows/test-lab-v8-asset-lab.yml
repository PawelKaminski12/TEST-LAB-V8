name: TEST LAB V8 Asset LAB

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Ticker, np. BTC, ETH, ANET, PEPE'
        required: false
        type: string
      source_symbol:
        description: 'Symbol źródłowy; puste = auto'
        required: false
        type: string
      asset_type:
        description: 'Typ aktywa'
        required: false
        default: 'AUTO'
        type: choice
        options: [AUTO, CRYPTO, STOCK, MEME]
      mode:
        description: 'Tryb analizy'
        required: false
        default: 'BOTH'
        type: choice
        options: [FAST, DEEP, BOTH]
      save_to_watchlist:
        description: 'Zapisać ticker do stałej obserwacji LAB?'
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '10 */6 * * *'
  push:
    paths:
      - 'config/lab_assets.csv'
      - 'scripts/v8_asset_lab.py'
      - 'scripts/v8_asset_lab_summary.py'
      - '.github/workflows/test-lab-v8-asset-lab.yml'
      - 'crypto_data_hub/CRYPTO_MARKET_PHASE.json'
      - 'crypto_data_hub/ONCHAIN_ACTIVITY.json'
      - 'crypto_data_hub/ALT_ENGINE_MASTER_CHECKPOINT.json'

permissions:
  contents: write

concurrency:
  group: v8-asset-lab-writes
  cancel-in-progress: false

jobs:
  build-asset-lab:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz najnowszą wersję projektu
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Przygotuj Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Zainstaluj potrzebne biblioteki
        run: pip install --quiet pandas numpy yfinance requests
      - name: Dodaj ręcznie wskazane aktywo do analizy
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.symbol != '' }}
        env:
          LAB_SYMBOL: ${{ inputs.symbol }}
          LAB_SOURCE_SYMBOL: ${{ inputs.source_symbol }}
          LAB_ASSET_TYPE: ${{ inputs.asset_type }}
          LAB_MODE: ${{ inputs.mode }}
          LAB_SAVE: ${{ inputs.save_to_watchlist }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from datetime import datetime, timezone
          import pandas as pd
          path=Path('config/lab_assets.csv')
          cols=['symbol','source_symbol','asset_type','mode','enabled','added_at_utc','notes']
          try: df=pd.read_csv(path)
          except Exception: df=pd.DataFrame(columns=cols)
          for c in cols:
              if c not in df.columns: df[c]=''
          symbol=os.environ.get('LAB_SYMBOL','').strip().upper(); typ=os.environ.get('LAB_ASSET_TYPE','AUTO').strip().upper() or 'AUTO'; mode=os.environ.get('LAB_MODE','BOTH').strip().upper() or 'BOTH'; src=os.environ.get('LAB_SOURCE_SYMBOL','').strip(); save=os.environ.get('LAB_SAVE','true').strip().lower()=='true'
          if not symbol: raise SystemExit('Brak tickera do analizy')
          if typ not in {'AUTO','CRYPTO','STOCK','MEME'}: raise SystemExit('Nieprawidłowy typ aktywa')
          if mode not in {'FAST','DEEP','BOTH'}: raise SystemExit('Nieprawidłowy tryb analizy')
          if not src: src=f'{symbol}-USD' if typ in {'CRYPTO','MEME'} else symbol
          if typ=='AUTO': typ='CRYPTO' if src.upper().endswith('-USD') else 'STOCK'
          now=datetime.now(timezone.utc).isoformat(); mask=df['symbol'].astype(str).str.upper().eq(symbol)
          row={'symbol':symbol,'source_symbol':src,'asset_type':typ,'mode':mode,'enabled':'true','added_at_utc':now,'notes':'MANUAL_LAB_REQUEST' if save else 'ONE_SHOT_LAB_REQUEST'}
          if mask.any():
              idx=df.index[mask][0]; existing=str(df.loc[idx,'added_at_utc']).strip()
              if existing and existing.lower()!='nan': row['added_at_utc']=existing
              for k,v in row.items(): df.loc[idx,k]=v
          else: df=pd.concat([df,pd.DataFrame([row])],ignore_index=True)
          df[cols].to_csv(path,index=False)
          print({'ticker':symbol,'typ':typ,'tryb':mode,'zapis_do_obserwacji':save})
          PY
      - name: Uruchom analizę aktywów
        run: python scripts/v8_asset_lab.py
      - name: Zbuduj czytelny raport po polsku
        run: python scripts/v8_asset_lab_summary.py
      - name: Sprawdź analizę i raport użytkownika
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status=json.loads(Path('lab/LAB_STATUS.json').read_text())
          assert status['fast_mode_ready'] is True
          assert status.get('fast_multitimeframe_enabled') is True
          assert status['deep_mode_ready'] is True
          assert status.get('deep_comparison_enabled') is True
          assert status.get('polish_user_language') is True
          assert status.get('btc_eth_dedicated_etf_filter') is True
          assert status['portfolio_connection'] is False
          assert status['execution_connection'] is False
          report=json.loads(Path('lab/LAB_REPORT.json').read_text())
          assert report.get('engine')=='V8_ASSET_LAB_v0.5'
          seen={a.get('symbol') for a in report.get('reports',[])}
          for a in report.get('reports',[]):
              assert 'opis_po_polsku' in a
              assert 'technical' in a and set(['1H','4H','1D']).issubset(a['technical'])
              if a.get('symbol') in {'BTC','ETH'}: assert a.get('etf_context') is not None
          if {'BTC','ETH'}.issubset(seen):
              assert all(next(a for a in report['reports'] if a.get('symbol')==s).get('etf_context') is not None for s in ('BTC','ETH'))
          summary=Path('lab/LAB_LATEST.md').read_text(encoding='utf-8')
          for forbidden in ['PARTIAL','DATA_READY','STRONG_CONTEXT','MIXED_CONTEXT','DEEP:','TRACKING']:
              assert forbidden not in summary
          print('V8 LAB v0.5: filtry ETF BTC i ETH sprawdzone poprawnie')
          PY
      - name: Zapisz wyniki i historię
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lab/LAB_REPORT.json lab/LAB_COCKPIT.csv lab/LAB_HISTORY.csv lab/LAB_STATUS.json lab/LAB_LATEST.md
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.symbol }}" != "" ] && [ "${{ inputs.save_to_watchlist }}" = "true" ]; then git add config/lab_assets.csv; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update V8 Asset LAB outputs'
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            mkdir -p /tmp/labout
            cp lab/LAB_REPORT.json lab/LAB_COCKPIT.csv lab/LAB_HISTORY.csv lab/LAB_STATUS.json lab/LAB_LATEST.md /tmp/labout/
            if [ -f config/lab_assets.csv ]; then cp config/lab_assets.csv /tmp/labout/lab_assets.csv; fi
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/labout/LAB_REPORT.json /tmp/labout/LAB_COCKPIT.csv /tmp/labout/LAB_HISTORY.csv /tmp/labout/LAB_STATUS.json /tmp/labout/LAB_LATEST.md lab/
            git add lab/LAB_REPORT.json lab/LAB_COCKPIT.csv lab/LAB_HISTORY.csv lab/LAB_STATUS.json lab/LAB_LATEST.md
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.symbol }}" != "" ] && [ "${{ inputs.save_to_watchlist }}" = "true" ] && [ -f /tmp/labout/lab_assets.csv ]; then cp /tmp/labout/lab_assets.csv config/lab_assets.csv; git add config/lab_assets.csv; fi
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Update V8 Asset LAB outputs'
            sleep $((attempt * 3))
          done
          exit 1
