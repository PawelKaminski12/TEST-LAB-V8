name: TEST LAB V8 Tactical Readiness

on:
  workflow_dispatch:
  schedule:
    - cron: '35 */4 * * *'
  push:
    paths:
      - 'tactical_engine/TACTICAL_ENGINE.json'
      - 'tactical_engine/TACTICAL_READINESS.json'
      - 'config/market_reader_signals.csv'
      - '.github/workflows/test-lab-v8-tactical-readiness.yml'

permissions:
  contents: read

concurrency:
  group: v8-tactical-readiness-v1
  cancel-in-progress: false

jobs:
  validate-tactical-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz najnowszy projekt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Przygotuj Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sprawdź gotowość TACTICAL 14 aktywów
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected=['BTC','ETH','SOL','LINK','ONDO','RENDER','FLOKI','PEPE','SPX6900','XRP','XLM','HBAR','AVAX','AWE']
          eng_path=Path('tactical_engine/TACTICAL_ENGINE.json')
          ready_path=Path('tactical_engine/TACTICAL_READINESS.json')
          if not eng_path.exists() or not ready_path.exists():
              raise SystemExit('Brak plików TACTICAL_ENGINE.json lub TACTICAL_READINESS.json')

          eng=json.loads(eng_path.read_text(encoding='utf-8'))
          ready=json.loads(ready_path.read_text(encoding='utf-8'))

          assert eng.get('engine')=='V8_TACTICAL_ENGINE_v1.0', eng.get('engine')
          assert eng.get('universe')==expected, eng.get('universe')
          assert eng.get('asset_count')==14, eng.get('asset_count')
          assert eng.get('stocks_included') is False
          assert eng.get('not_execution_connected') is True

          assets={a.get('symbol'):a for a in eng.get('assets',[])}
          assert set(assets)==set(expected), sorted(assets)
          for sym in expected:
              a=assets[sym]
              assert a.get('qa')=='PASS', (sym,a.get('qa'))
              tfs=a.get('timeframes') or {}
              assert set(tfs)=={'1H','4H','1D'}, (sym,list(tfs))
              for tf in ['1H','4H','1D']:
                  x=tfs[tf]
                  assert x.get('closed_bar_only') is True, (sym,tf,'świeca otwarta')
                  assert x.get('stale') is False, (sym,tf,'dane nieświeże')
                  assert x.get('rsi14') is not None, (sym,tf,'brak RSI')
                  assert x.get('mfi14') is not None, (sym,tf,'brak MFI')
                  assert x.get('macd_hist') is not None, (sym,tf,'brak MACD')
                  assert x.get('macd_hist_percentile') is not None, (sym,tf,'brak percentyla MACD')
                  assert x.get('macd_hist_zscore') is not None, (sym,tf,'brak z-score MACD')

          assert ready.get('asset_count')==14, ready.get('asset_count')
          assert ready.get('all_assets_ready') is True, ready.get('all_assets_ready')
          assert ready.get('stocks_included') is False
          assert ready.get('execution_connected') is False
          assert ready.get('tradingview_connected') is False

          print('TACTICAL — ZAKOŃCZONE POPRAWNIE: BTC + 13 altów, 1H/4H/1D, zamknięte świece, RSI/MFI/MACD/FOMO, bez automatycznej realizacji.')
          PY
