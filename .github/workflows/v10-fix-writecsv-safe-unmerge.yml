name: V10 Fix writeCsv Safe Unmerge

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_v10_writecsv_safe_unmerge.py'
      - '.github/workflows/v10-fix-writecsv-safe-unmerge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_v10_writecsv_safe_unmerge.py
      - name: Syntax check
        run: |
          cp google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt /tmp/v10.js
          node --check /tmp/v10.js
      - name: Static invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt').read_text(encoding='utf-8')
          assert 'function writeCsvSheet_(sheet, csvText, preserveCompactPanel)' in s
          body=s.split('function writeCsvSheet_(sheet, csvText, preserveCompactPanel)',1)[1].split('\n}',1)[0]
          assert 'unmergeAllSafelyV10_(sheet);' in body
          funcs=re.findall(r'(?m)^\s*function\s+([A-Za-z_$][\w$]*)\s*\(',s)
          assert len(funcs)==len(set(funcs)), 'duplicate top-level functions remain'
          print('writeCsv safe-unmerge + unique functions: OK')
          PY
      - name: Commit patched V10
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Fix V10 CSV writes across old merged cells'
          git pull --rebase origin main
          git push origin main
