name: V10 Radar Warning + Machine Hide Fix

on:
  push:
    paths:
      - 'scripts/patch_v10_radar_warning_and_machine_hide.py'
      - '.github/workflows/v10-radar-warning-machine-hide.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_v10_radar_warning_and_machine_hide.py
      - name: Syntax check
        run: |
          cp google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt /tmp/v10.js
          node --check /tmp/v10.js
      - name: Static checks
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt').read_text(encoding='utf-8')
          assert "machineSheet.hideSheet();" not in s
          assert "if (macd && macd.indexOf('NORMAL') < 0) return 'WARN';" in s
          assert "if (Number.isFinite(mfi) && (mfi >= 80 || mfi <= 20)) return 'WARN';" in s
          assert "if (mfi >= 80 || mfi <= 20) paintMorningRangeV10_" in s
          print('Radar warning + machine hide invariants OK')
          PY
      - name: Commit patched V10
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Fix V10 radar warning colors and machine sheet hide'
            git pull --rebase origin main
            git push origin main
          fi
