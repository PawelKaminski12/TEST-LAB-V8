name: V10 Skip Technical Sheet Writes

on:
  push:
    paths:
      - 'scripts/patch_v10_skip_technical_sheet_writes.py'
      - '.github/workflows/v10-skip-technical-sheet-writes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_v10_skip_technical_sheet_writes.py
      - name: Syntax check
        run: |
          cp google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt /tmp/v10.js
          node --check /tmp/v10.js
      - name: Static checks
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt').read_text(encoding='utf-8')
          start=s.index('function ODSWIEZ_WSZYSTKO()')
          end=s.find('\nfunction ', start+1)
          b=s[start:end if end>0 else len(s)]
          assert 'writeCsvSheet_(' not in b
          assert "V10_MARKET_READER_CSV_CACHE" in b
          assert "V10_MACHINE_CSV_CACHE" in b
          print('ODSWIEZ_WSZYSTKO technical sheet writes bypassed')
          PY
      - name: Commit patched V10
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Bypass V10 technical sheet writes'
            git pull --rebase origin main
            git push origin main
          fi
