name: TEST LAB V8 Tactical Engine

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */4 * * *'
  push:
    paths:
      - 'config/tactical_universe.csv'
      - 'config/alt_zones.csv'
      - 'crypto_data_hub/CRYPTO_MARKET_PHASE.json'
      - 'scripts/v8_tactical_engine_v1.py'
      - 'scripts/v8_tactical_engine_v1_1.py'
      - '.github/workflows/test-lab-v8-tactical-engine.yml'

permissions:
  contents: write

concurrency:
  group: v8-tactical-engine-writes
  cancel-in-progress: false

jobs:
  build-tactical-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz najnowszy projekt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Przygotuj Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zainstaluj biblioteki
        run: pip install --quiet pandas requests numpy

      - name: Zbuduj TACTICAL 1H 4H 1D
        run: python scripts/v8_tactical_engine_v1_1.py

      - name: Sprawdź komplet 14 aktywów i alarmów
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          import pandas as pd

          expected=['BTC','ETH','SOL','LINK','ONDO','RENDER','FLOKI','PEPE','SPX6900','XRP','XLM','HBAR','AVAX','AWE']
          p=Path('tactical_engine/TACTICAL_ENGINE.json')
          r=Path('tactical_engine/TACTICAL_READINESS.json')
          q=Path('tactical_engine/TACTICAL_QA.csv')
          m=Path('tactical_engine/TACTICAL_MACD_EXTREMES.csv')
          c=Path('tactical_engine/TACTICAL_EXTREME_CONFLUENCE.csv')
          assert p.exists() and r.exists() and q.exists() and m.exists() and c.exists()
          data=json.loads(p.read_text(encoding='utf-8'))
          ready=json.loads(r.read_text(encoding='utf-8'))
          assert data['engine']=='V8_TACTICAL_ENGINE_v1.0'
          assert data['universe']==expected
          assert data['asset_count']==14
          assert data['stocks_included'] is False
          assert data['not_execution_connected'] is True
          assert data['rules']['tradingview_connected'] is False
          assert data['rules']['mfi_edge_cases_fixed'] is True
          assert data['rules']['macd_extremes_relative_to_own_history'] is True
          assert [a['symbol'] for a in data['assets']]==expected
          assert all(a['qa']=='PASS' for a in data['assets'])
          for a in data['assets']:
              assert set(a['timeframes'])=={'1H','4H','1D'}
              for tf in ['1H','4H','1D']:
                  x=a['timeframes'][tf]
                  assert x['closed_bar_only'] is True and x['stale'] is False
                  assert x['mfi14'] is not None and math.isfinite(float(x['mfi14'])) and 0 <= float(x['mfi14']) <= 100
                  assert x['rsi14'] is not None and math.isfinite(float(x['rsi14'])) and 0 <= float(x['rsi14']) <= 100
                  assert x['macd_hist_percentile'] is not None and math.isfinite(float(x['macd_hist_percentile']))
                  assert x['macd_hist_zscore'] is not None and math.isfinite(float(x['macd_hist_zscore']))
                  assert 0 <= int(x['fomo_score_0_10']) <= 10
          spx=next(a for a in data['assets'] if a['symbol']=='SPX6900')
          assert all(spx['source_types'][tf]=='SPOT_KRAKEN' for tf in ['1H','4H','1D'])
          assert ready['all_assets_ready'] is True and ready['asset_count']==14
          assert ready['stocks_included'] is False and ready['execution_connected'] is False
          qa=pd.read_csv(q)
          assert len(qa)==14 and qa['PASS'].astype(str).str.lower().eq('true').all()
          print('TACTICAL: 14/14 aktywów (BTC + 13 altów), 1H/4H/1D, RSI/MFI/MACD/FOMO i alarmy — sprawdzone poprawnie.')
          PY

      - name: Zapisz wyniki bez konfliktu
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/tactical-v1
          cp tactical_engine/TACTICAL_ENGINE.json tactical_engine/TACTICAL_QA.csv tactical_engine/TACTICAL_COCKPIT.csv tactical_engine/TACTICAL_MACD_EXTREMES.csv tactical_engine/TACTICAL_EXTREME_CONFLUENCE.csv tactical_engine/TACTICAL_READINESS.csv tactical_engine/TACTICAL_READINESS.json /tmp/tactical-v1/
          cp tactical_engine/*USDT_1H.csv tactical_engine/*USDT_4H.csv tactical_engine/*USDT_1D.csv /tmp/tactical-v1/ 2>/dev/null || true
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p tactical_engine
            cp /tmp/tactical-v1/* tactical_engine/
            git add tactical_engine/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Update V8 tactical engine 14 assets'
            if git push origin main; then exit 0; fi
            echo "Konflikt zapisu — próba $attempt"
            sleep $((attempt*3))
          done
          exit 1
