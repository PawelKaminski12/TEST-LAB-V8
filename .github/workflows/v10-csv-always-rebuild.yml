name: V10 CSV Always Rebuild

on:
  push:
    paths:
      - 'scripts/patch_v10_csv_rebuild_always.py'
      - '.github/workflows/v10-csv-always-rebuild.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply always-rebuild CSV patch
        run: python scripts/patch_v10_csv_rebuild_always.py
      - name: Syntax check
        run: |
          cp google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt /tmp/v10.js
          node --check /tmp/v10.js
      - name: Static checks
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt').read_text(encoding='utf-8')
          start=s.index('function writeCsvSheet_(')
          end=s.find('\nfunction ', start+1)
          b=s[start:end if end>0 else len(s)]
          assert 'getMergedRanges()' not in b
          assert 'breakApart()' not in b
          assert 'unmergeAllSafelyV10_' not in b
          assert 'ss.deleteSheet(sheet);' in b
          assert 'ss.insertSheet(name, index);' in b
          assert "let machineSheet = getOrCreateSheet_(ss, 'DANE_MASZYNOWNIA');" in s
          assert 'machineSheet = writeCsvSheet_(machineSheet, machineCsv, false);' in s
          assert 'machineSheet.hideSheet();' in s
          print('CSV rebuild invariants OK')
          PY
      - name: Commit patched V10
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Harden V10 technical CSV rebuilds'
            git pull --rebase origin main
            git push origin main
          fi
