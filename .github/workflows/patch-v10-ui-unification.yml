name: Patch V10 UI Unification

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_v10_ui_unification.py'
      - '.github/workflows/patch-v10-ui-unification.yml'

permissions:
  contents: write

concurrency:
  group: v10-ui-unification
  cancel-in-progress: false

jobs:
  patch-v10-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch V10 UI
        run: python scripts/patch_v10_ui_unification.py

      - name: Validate patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt')
          s=p.read_text(encoding='utf-8')
          assert 'V10 UI UNIFICATION PACK' in s
          assert 'applyUnifiedThemeV10_(ss);' in s
          assert 'sheet.getDataRange().breakApart();' in s
          assert 'DOLNE OSTRZEŻ' in s
          print('V10 UI UNIFICATION: OK')
          PY

      - name: Commit patched V10
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt
          if git diff --cached --quiet; then
            echo 'No V10 changes'
            exit 0
          fi
          git commit -m 'Unify V10 dashboard colors and fix merged ranges'
          git pull --rebase origin main
          git push origin main
