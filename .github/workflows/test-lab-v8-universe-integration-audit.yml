name: TEST LAB V8 Universe Integration Audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/v8_universe_integration_audit.py'
      - 'config/tactical_universe.csv'
      - 'config/alt_universe.csv'
      - 'config/alt_zones.csv'
      - 'tactical_engine/TACTICAL_ENGINE.json'
      - 'tactical_engine/TACTICAL_READINESS.json'
      - 'crypto_data_hub/ALT_TECHNICAL_LAYER.json'
      - 'crypto_data_hub/ALT_DECISION_ENGINE.json'
      - 'google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL.txt'
      - '.github/workflows/test-lab-v8-universe-integration-audit.yml'

permissions:
  contents: write

concurrency:
  group: v8-universe-integration-audit
  cancel-in-progress: false

jobs:
  integration-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz najnowszy projekt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Przygotuj Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zainstaluj biblioteki
        run: pip install --quiet pandas

      - name: Sprawdź oba silniki, alarmy i listy aktywów
        run: python scripts/v8_universe_integration_audit.py

      - name: Sprawdź wynik końcowy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('audit/V8_UNIVERSE_INTEGRATION_AUDIT.json')
          m=Path('audit/V8_UNIVERSE_INTEGRATION_LATEST.md')
          assert p.exists() and m.exists()
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['engine']=='V8_UNIVERSE_INTEGRATION_AUDIT_v1.0'
          assert x['core_checks_pass'] is True
          assert x['tactical']['asset_count']==12
          assert x['long']['alt_count']==11
          assert x['alerts']['google_sheets_panel'] is True
          assert x['alerts']['email_supported_by_bridge'] is True
          assert x['tactical']['tradingview_connected'] is False
          assert x['tactical']['execution_connected'] is False
          assert x['long']['execution_connected'] is False
          assert x['aave']=='ARCHIWUM — NIEAKTYWNY'
          print('Końcowa integracja obu silników: sprawdzona poprawnie.')
          PY

      - name: Zapisz raport bez konfliktu
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/integration-audit
          cp audit/V8_UNIVERSE_INTEGRATION_AUDIT.json audit/V8_UNIVERSE_INTEGRATION_LATEST.md /tmp/integration-audit/
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p audit
            cp /tmp/integration-audit/V8_UNIVERSE_INTEGRATION_AUDIT.json /tmp/integration-audit/V8_UNIVERSE_INTEGRATION_LATEST.md audit/
            git add audit/V8_UNIVERSE_INTEGRATION_AUDIT.json audit/V8_UNIVERSE_INTEGRATION_LATEST.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Update V8 universe integration audit'
            if git push origin main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
