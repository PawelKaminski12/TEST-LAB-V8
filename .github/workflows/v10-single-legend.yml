name: V10 Single Morning Radar Legend

on:
  push:
    paths:
      - 'scripts/patch_v10_single_legend.py'
      - '.github/workflows/v10-single-legend.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_v10_single_legend.py
      - name: Syntax check
        run: |
          cp google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt /tmp/v10.js
          node --check /tmp/v10.js
      - name: Static checks
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt').read_text(encoding='utf-8')
          assert s.count("drawMorningRadarLegendV10_(sheet);") == 1
          assert "sheet.getRange('L4:O4').merge().setValue('LEGENDA KOLORÓW')" not in s
          assert "const title = sheet.getRange('L4:O4');" in s
          print('Single legend invariants OK')
          PY
      - name: Commit patched V10
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google_sheets/DUAL_ENGINE_APPS_SCRIPT_FULL_V10.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Fix overlapping Morning Radar legend merges'
            git pull --rebase origin main
            git push origin main
          fi
